/* result sheet: adaptive to the customer's stage, with mandatory fields that cannot be skipped */
function num(s){ const n=Number(String(s||"").replace(/[٠-٩]/g,x=>"٠١٢٣٤٥٦٧٨٩".indexOf(x)).replace(/[,\s٬]/g,"")); return isFinite(n)?n:0; }
/* result sheet v2: the result is the only required answer. The app fills the rest (channel, goal, goal-met, next step) and the coach suggests them. */
function nextWorking(d){ let x=d; for(let i=0;i<7&&dow(x)===5;i++) x=addDays(x,1); return x; }
function nowHM2(){ const d=new Date(); return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0"); }
/* the channel is known from what the salesman did: a call logged for this customer that day means a call, otherwise a field visit */
function inferChannel(v){
  if(v.channel) return v.channel;
  return S.messages.some(m=>m.customerId===v.customerId&&m.date===v.date&&(m.kind==="call"||m.kind==="qcall"))?"call":"visit";
}
/* goal met is read from the result and from real orders synced from the operations app within 3 days */
function inferGoalMet(v,res){
  if(res==="absent") return "";
  if(res==="order"||S.events.some(e=>e.cid===v.customerId&&e.date>=v.date&&e.date<=addDays(v.date,3))) return "yes";
  return res==="interested"?"part":"no";
}
/* the coach proposes the next step from the result, the customer's stage and his ordering rhythm */
function suggestNext(v,res,sk){
  const base=v.date>todayStr()?v.date:todayStr(), c=S.customers.get(v.customerId)||{}, fm=fmOf(c), gap=fm&&fm.gap?fm.gap:null;
  let t="", n=3;
  if(res==="absent"){ t="إعادة الزيارة: لم يتواجد"; n=1; }
  else if(res==="notnow"){ t="معاودة التواصل لمعرفة إن تغيّر احتياجه"; n=14; }
  else if(res==="order"){ t="تأكيد رضاه عن الطلبية وطلب التالية"; n=gap?Math.min(Math.max(gap,5),14):7; }
  else if(sk==="new0"){ t="متابعة اهتمامه وعرض طلبية تجربة صغيرة"; n=3; }
  else if(sk==="new1"){ t="طلب الطلبية الثانية"; n=4; }
  else if(sk==="new2"){ t="طلب الطلبية الثالثة لتثبيته عميلاً حالياً"; n=4; }
  else if(sk==="lapsed"){ t="متابعة عرض الطلبية التجريبية"; n=4; }
  else { t="طلبية هذا الأسبوع"; n=gap?Math.min(Math.max(Math.round(gap/2),3),7):5; }
  return {text:t,date:nextWorking(addDays(base,n))};
}
/* the achievements list follows the result: a refusal asks about the reason, an interested customer about the offer */
function checkRelevant(key,res){
  if(key==="next"||!res||res==="absent") return false;
  if(res==="notnow") return ["why","fix","need","sat","dm","intro"].includes(key);
  return true;
}
function openResult(id, opt){
  const v=S.visitById.get(id); if(!v){ toast("الزيارة غير موجودة"); return; }
  const c=S.customers.get(v.customerId)||{};

  const r=(name,val,label,checked)=>'<input type="radio" name="'+name+'" id="'+name+'-'+val+'" value="'+val+'"'+(checked?" checked":"")+'><label for="'+name+'-'+val+'">'+label+'</label>';

  body+='<div class="field" id="rs-smart" hidden>'
    +'<div class="v-note"><span class="k">الهدف</span>'+esc(goal)+'</div>'
    +'<div class="v-note"><span class="k">الخطوة القادمة · يقترحها التطبيق</span><span id="rs-nextline"></span></div>'
    +'<button type="button" class="btn sm ghost" id="rs-nextedit">تغيير الخطوة أو الموعد</button>'

    +'<input id="rs-nextd" class="input" type="date" value="'+esc(v.next&&v.next.date||"")+'" aria-label="تاريخ الخطوة القادمة" min="'+esc(addDays(v.date,1))+'">'
    +'<label style="display:flex;gap:8px;align-items:center;font-size:14px"><input type="checkbox" id="rs-auto" checked style="width:18px;height:18px;accent-color:var(--accent)">أضفها تلقائياً إلى خطة ذلك اليوم</label></div></div>';
  body+='<div class="field" id="rs-reasonbox" hidden><label for="rs-reason">سبب عدم الاهتمام (اختياري)</label><select id="rs-reason" class="input"><option value="">اختر السبب</option>'+REASONS.map(x=>'<option'+(v.reason===x?" selected":"")+'>'+x+'</option>').join("")+'</select></div>';
  body+='<div class="field"><label for="rs-notes">ملاحظة سريعة (اختياري)</label><textarea id="rs-notes" class="input" rows="2" placeholder="ماذا يحتاج العميل؟ ماذا قال؟ ماذا اتفقنا؟">'+esc(v.notes||"")+'</textarea></div>';
  body+='<details class="rs-more"'+(v.state==="done"?" open":"")+'><summary style="cursor:pointer;font-weight:600;padding:8px 0">تفاصيل إضافية (اختياري)</summary>';
  body+='<div class="field" id="rs-checkbox"><span class="lab">ما أنجزته في الزيارة · <span id="rs-score">0</span></span><div class="checks">'+stg.checks.filter(k=>k[0]!=="next").map(k=>'<label data-ck="'+k[0]+'"><input type="checkbox" id="rs-ck-'+k[0]+'"'+(v.checks&&v.checks[k[0]]?" checked":"")+'>'+k[1]+'</label>').join("")+'</div></div>';
  if(others.length){
    body+='<div class="field" id="rs-peoplebox"><span class="lab">هل قابلت أشخاصاً آخرين من نفس المنشأة؟</span><div class="people-pick">'+others.map((o,i)=>{
      const p=prevP.get(o.id), on=!!p;
      return '<div class="pp"><label class="pph"><input type="checkbox" id="pp-on-'+i+'"'+(on?" checked":"")+'><span>'+esc(cname(o))+(o.title?' · '+esc(o.title):'')+'</span></label>'
        +'<div id="pp-box-'+i+'"'+(on?'':' hidden')+' style="display:flex;flex-direction:column;gap:6px"><select id="pp-res-'+i+'" class="input">'+["interested","notnow"].map(k=>'<option value="'+k+'"'+((p&&p.result)===k?" selected":"")+'>'+RESULT[k]+'</option>').join("")+'</select></div></div>';
    }).join("")+'</div><span class="help">نتيجة كل شخص تُسجَّل على حدة، والزيارة تبقى واحدة.</span></div>';

    sub: esc([facOf(c).name, dLong(v.date)].filter(Boolean).join(" · ")) + ' ' + chipFor(v.customerId),

    mount(root){
      let dirty=false; /* a saved next step is kept only while the result is unchanged and the salesman has not edited it */

        $("#rs-nextline").textContent=(nt.value||"—")+(nd.value?" · "+dShort(nd.value):"");
        let shown=0, done=0;

        others.forEach((o,i)=>{ const on=$("#pp-on-"+i).checked; $("#pp-box-"+i).hidden=!on; });
      };
      nt.addEventListener("input",()=>{ dirty=true; });
      nd.addEventListener("change",()=>{ dirty=true; });
      $("#rs-nextedit").addEventListener("click",()=>{ $("#rs-nextbox").hidden=!$("#rs-nextbox").hidden; });
      root.addEventListener("change",sync); root.addEventListener("input",e=>{ if(e.target===nt) sync(); }); sync();
      $("#rs-save").addEventListener("click",()=>saveResult(v,stg,others));
      const m=$("#rs-missed"); if(m) m.addEventListener("click",async()=>{ if(await updateVisit(v.id,{state:"missed",time:$("#rs-time").value},"سُجّلت كزيارة لم تتم")) closeSheet(); });
      const d=$("#rs-del"); if(d) d.addEventListener("click",async()=>{ if(await removeVisit(v.id)) closeSheet(); });
    }
  });
}
async function saveResult(v,stg,others){
  const err=$("#rs-err"), bad=[], miss=[];
  document.querySelectorAll("#sh-body .bad").forEach(x=>x.classList.remove("bad"));
  const fail=(msg,el)=>{ miss.push(msg); if(el) bad.push(el); };
  const res=(document.querySelector('input[name="rs-res"]:checked')||{}).value;
  const notes=$("#rs-notes").value.trim(), nt=$("#rs-next").value.trim(), nd=$("#rs-nextd").value;
  const reason=$("#rs-reason").value;
  const people=[];
  /* the result is the only required field: everything else is optional or filled by the app */
  if(!res) fail("اختر نتيجة الزيارة",$("#f-res"));
  else if(nd&&nd<=v.date) fail("تاريخ الخطوة القادمة يجب أن يكون بعد تاريخ الزيارة",$("#rs-nextd"));
  else if(res!=="absent"){
    others.forEach((o,i)=>{
      if(!$("#pp-on-"+i).checked) return;
      people.push({id:o.id,result:$("#pp-res-"+i).value});
    });
  }
  if(miss.length){
    bad.forEach(e=>e.classList.add("bad"));
    err.innerHTML='<b>أكمل ما يلي قبل الحفظ:</b><ul style="margin:4px 0 0;padding-inline-start:18px">'+miss.map(m=>'<li>'+esc(m)+'</li>').join("")+'</ul>';
    err.hidden=false; if(bad[0]&&bad[0].scrollIntoView) bad[0].scrollIntoView({block:"center",behavior:"smooth"}); return;
  }
  err.hidden=true;
  const abs=res==="absent", checks={};
  if(!abs) document.querySelectorAll('#rs-checkbox:not([hidden]) label[data-ck]:not([hidden]) input').forEach(i=>{ checks[i.id.replace("rs-ck-","")]=i.checked; });
  const btn=$("#rs-save"); btn.disabled=true;
  const ok=await updateVisit(v.id,{state:"done",result:res,channel:inferChannel(v),notes,next_text:nt,next_date:nd||null,checks,goal:v.goal||stg.goals[0],goal_met:inferGoalMet(v,res),reason:res==="notnow"?reason:"",people,time:$("#rs-time").value||nowHM2(),done_at:new Date().toISOString(),done_by:S.email});
  if(!ok){ btn.disabled=false; return; }
  let msg = "حُفظت النتيجة"; /* orders are never entered here: they come from the operations app */
  if(nd && $("#rs-auto").checked && nd!==v.date && nd>=todayStr() && !visitFor(v.customerId,nd)){
    const nid=await createVisit(v.customerId,nd,{purpose:"followup",from_visit:v.id});
    if(nid) msg+=" وأُضيفت المتابعة لخطة "+dShort(nd);
  }
  toast(msg); closeSheet();
  /* no popup: the thank-you message for a new account waits in "follow-up without a visit" and is sent with one tap when the salesman chooses */
}

/* orders: one row per person who ordered in a visit; margin is stored apart and only the manager can read it */
async function syncOrders(v, entries){
  const existing=S.orders.filter(o=>o.visitId===v.id), keep=new Set();
  for(const e of entries){
    const c=S.customers.get(e.cid), ex=existing.find(o=>o.customerId===e.cid);
    const row={order_no:e.orderNo||null,value:e.value>0?e.value:null,date:v.date};
    let r;
    if(ex){ keep.add(ex.id); r=await guard(sb.from("orders").update(row).eq("id",ex.id).select().single()); }
    else r=await guard(sb.from("orders").insert(Object.assign({id:uuid(),visit_id:v.id,customer_id:e.cid,facility_id:c?c.facilityId:null,status:"confirmed",source:"manual",created_by:S.email},row)).select().single());
    if(r){ putOrder(r); if(e.margin!=null&&S.isOwner) await saveMargin(r.id,e.margin); }
  }
  for(const ex of existing) if(!keep.has(ex.id)&&ex.source==="manual"){ const d=await guard(sb.from("orders").delete().eq("id",ex.id)); if(d) dropOrder(ex.id); }
  refresh();
}
async function saveMargin(oid,pct){
  const r=await guard(sb.from("order_costs").upsert({order_id:oid,margin_pct:pct}).select().single());
  if(!r) return;
  S.costs.set(oid,Number(r.margin_pct));
  const o=S.orders.find(x=>x.id===oid), c=o&&S.customers.get(o.customerId); if(!c||!c.facilityId) return;
  const k=facKey(c), t90=addDays(todayStr(),-90);
  let sv=0,sm=0,n=0,sp=0;
  for(const x of S.orders){ const cc=S.customers.get(x.customerId); if(!cc||facKey(cc)!==k||x.date<=t90||!S.costs.has(x.id)) continue; const m=S.costs.get(x.id); n++; sp+=m; if(x.value>0){ sv+=x.value; sm+=x.value*m; } }
  if(!n) return;
  const f=await guard(sb.from("facilities").update({margin_score:clamp((sv>0?sm/sv:sp/n)/S.cfg.marginGood*100)}).eq("id",c.facilityId).select().single());
  if(f) putFac(f);
}

/* ---------- QUOTES: price requests per day and how many close ---------- */
function qDate(q){ return q.closedAt?ymd(new Date(q.closedAt)):""; }
function quoteStats(day){
  const q=S.quotes, ws=weekStart(day), we=addDays(ws,6), mk=monthKey(day), won=x=>x.status==="won", W=(a,b)=>S.orders.filter(o=>o.source==="ops"&&o.status!=="cancelled"&&o.date>=a&&o.date<=b&&o.value>0).length; /* a win = a confirmed (non-returned) order of one of our customers */
  return {
    day:{n:q.filter(x=>x.date===day).length, w:W(day,day)},
    week:{n:q.filter(x=>x.date>=ws&&x.date<=we).length, w:W(ws,we)},
    month:{n:q.filter(x=>monthKey(x.date)===mk).length, w:W(mk+"-01",mk+"-31")}
  };
}

/* ---------- ACHIEVEMENTS: daily, weekly and monthly targets on closed quotes ---------- */
function achievements(day){
  const cfg=S.cfg, st=quoteStats(day), mk=monthKey(day), per=new Map();
  S.quotes.forEach(q=>{ if(q.status==="won"&&q.closedAt){ const d=qDate(q); per.set(d,(per.get(d)||0)+1); } });
  let daysHit=0; per.forEach((n,d)=>{ if(monthKey(d)===mk&&n>=cfg.dailyWins) daysHit++; });
  let streak=0, first=true;
  for(let d=day,i=0;i<120;d=addDays(d,-1),i++){ if(dow(d)===5||isOff(d)) continue; if((per.get(d)||0)>=cfg.dailyWins) streak++; else if(first&&d===day) { first=false; continue; } else break; first=false; }
  const weekT=cfg.weekWins, monthT=cfg.monthWins;
  const dayHit=st.day.w>=cfg.dailyWins, weekHit=st.week.w>=weekT, monthHit=st.month.w>=monthT;
  const credit=monthHit?"الهدف الشهري":weekHit?"الهدف الأسبوعي":dayHit?"الهدف اليومي":"";
  return {st,daysHit,streak,weekT,monthT,dayHit,weekHit,monthHit,credit,bonus:bonusInfo(day,credit)};
}
/* bonus: every closed deal beyond the target of the highest level reached earns bonusPct% of that deal's profit. Profit (margin) is manager-only, so the amount is computed only on the manager's device. */
function bonusInfo(day,credit){
  const cfg=S.cfg, mk=monthKey(day), lvl=credit==="الهدف الشهري"?"m":credit==="الهدف الأسبوعي"?"w":credit?"d":"";
  const o={n:0,amount:null,missing:0,pct:cfg.bonusPct};
  if(!lvl) return o;
  const won=S.quotes.filter(q=>q.status==="won"&&q.closedAt&&monthKey(qDate(q))===mk).sort((a,b)=>a.closedAt<b.closedAt?-1:1);
  const tgt=lvl==="m"?cfg.monthWins:lvl==="w"?cfg.weekWins:cfg.dailyWins, cnt=new Map(), ex=[];
  won.forEach(q=>{ const d=qDate(q), k=lvl==="m"?mk:lvl==="w"?weekStart(d):d, n=(cnt.get(k)||0)+1; cnt.set(k,n); if(n>tgt) ex.push(q); });
  o.n=ex.length;
  if(S.isOwner){
    let sum=0;
    ex.forEach(q=>{ const od=S.orders.find(x=>x.id===q.orderId), v=od&&od.value!=null?od.value:q.value, m=od?S.costs.get(od.id):null;
      if(v==null||m==null||isNaN(m)) o.missing++; else sum+=v*m/100*cfg.bonusPct/100; });
    o.amount=Math.round(sum);
  }
  return o;
}
function achLine(day){
  const a=achievements(day), cfg=S.cfg;
  return '<div class="achline">'
   +'<span class="chip '+(a.weekHit?"order":"muted")+'">الأسبوع '+a.st.week.w+'/'+a.weekT+(a.weekHit?' ✓':'')+'</span>'
   +'<span class="chip '+(a.monthHit?"order":"muted")+'">الشهر '+a.st.month.w+'/'+a.monthT+(a.monthHit?' ✓':'')+'</span></div>';
}
const dealsW=n=>n===2?"صفقتان":n>=3&&n<=10?"صفقات":"صفقة";
function achCard(day){
  const a=achievements(day), cfg=S.cfg, mk=monthKey(day), cm=S.commission.get(mk), reached=a.st.month.w>=cfg.monthWins, left=Math.max(0,cfg.monthWins-a.st.month.w), fm=n=>Math.round(Number(n)||0).toLocaleString("en-US");
  const who=S.isOwner?"عمولة المندوب":"عمولتك";
  let money;
  if(!reached) money='بقي <b>'+left+'</b> '+dealsW(left)+' ليبدأ احتساب '+who+': <b>'+cfg.bonusPct+'%</b> من صافي ربح كل صفقة فوق '+cfg.monthWins+' صفقة في الشهر (الربح بعد التوصيل).';
  else if(!cm) money='بلغ هدف الشهر. جارٍ احتساب العمولة، وتظهر هنا خلال دقائق.';
  else money='فوق هدف الشهر: <b>'+Number(cm.extra_n)+'</b> '+dealsW(Number(cm.extra_n))+'. '+who+' المؤكَّدة <b>'+fm(cm.confirmed)+'</b> ر.س'+(Number(cm.pending)>0?' + <b>'+fm(cm.pending)+'</b> ر.س معلّقة حتى يسدّد العملاء':'')+'.';
  return '<section class="card"><h3>إنجازاتك <small>الصفقات المؤكَّدة</small></h3>'
   +kpi("اليوم",a.st.day.w,cfg.dailyWins)+kpi("هذا الأسبوع",a.st.week.w,cfg.weekWins)+kpi("هذا الشهر",a.st.month.w,cfg.monthWins)
   +'<div class="credit '+(reached?"on":"")+'">'+money+'</div>'
   +'<div class="hint v-sub">الهدف اليومي والأسبوعي مؤشر وتيرة فقط. العمولة شهرية وتُصرف آخر الشهر، وتشمل الصفقات المسدّدة كاملة وغير المرتجعة وبهامش لا يقل عن 10%.</div></section>';
}/* ---------- NEW-CUSTOMER PLAYBOOK: a fixed rhythm of touches counted from the first visit, so no new account is forgotten ---------- */
/* [day from first visit, channel, what to do]: msg = WhatsApp, visit = field visit (or call), call = call or message */
const NEW_TOUCH=[[0,"msg","رسالة شكر بعد الزيارة"],[3,"msg","رسالة فيها قيمة: أسعار أو عرض جاهز"],[7,"visit","زيارة أو اتصال مع طلب تجربة صغيرة"],[14,"call","اتصال أو متابعة التسعير المفتوح"],[21,"visit","زيارة وتعرّف على صاحب القرار"],[30,"visit","مراجعة الشهر: لماذا لم يطلب بعد؟"],[44,"msg","رسالة متابعة"],[58,"visit","زيارة"],[72,"msg","رسالة متابعة"],[86,"visit","زيارة أخيرة قبل المتابعة البطيئة"]];
function newPlaybook(){
  const day=todayStr(), vis=new Map(), msg=new Map(), first=new Map(), out=[];
  const add=(m,cid,d)=>{ const c=S.customers.get(cid); if(!c) return; const k=facKey(c); if(!m.has(k)) m.set(k,[]); m.get(k).push(d); };
  for(const v of S.visits){ if(v.state!=="done") continue; add(vis,v.customerId,v.date); (v.people||[]).forEach(p=>add(vis,p.id,v.date));
    const c=S.customers.get(v.customerId); if(c){ const k=facKey(c); if(!first.has(k)||v.date<first.get(k)) first.set(k,v.date); } }
  S.messages.forEach(m=>{ if(m.kind!=="quoteDrop"&&!/^pay/.test(m.kind)) add(msg,m.customerId,m.date); }); /* payment reminders are not sales contacts */
  for(const [k,F] of first){
    const fm=S.facM.get(k); if(!fm||diff(F,day)>90||diff(F,day)<0) continue;
    if(!fm.people.every(p=>(S.der.get(p.id)||{}).status==="new")) continue;
    const V=vis.get(k)||[], M=msg.get(k)||[];
    let idx=-1;
    for(let i=0;i<NEW_TOUCH.length;i++){
      const D=addDays(F,NEW_TOUCH[i][0]), lo=NEW_TOUCH[i][0]?addDays(D,-1):F, ch=NEW_TOUCH[i][1];
      const ok=ch==="msg"?M.some(a=>a>=lo):ch==="visit"?V.some(a=>a>=lo&&a>F):V.some(a=>a>=lo&&a>F)||M.some(a=>a>=lo&&a>F);
      if(!ok){ idx=i; break; }
    }
    if(idx<0) continue;
    const touch=NEW_TOUCH[idx], due=addDays(F,touch[0]), all=[...V,...M].sort(), lastAct=all.length?all[all.length-1]:null;
    out.push({k,fm,c:fm.people[0],name:fm.fac.name||cname(fm.people[0]),F,age:diff(F,day),idx,touch,due,late:diff(due,day),idle:lastAct?diff(lastAct,day):0});
  }
  return out.sort((a,b)=>b.late-a.late);
}
/* newly registered accounts that were never visited: the first visit is due within two weeks of registration */
function firstVisitDue(){
  const day=todayStr(), out=[], seen=new Set();
  for(const c of S.customers.values()){
    if(stOf(c.id)!=="new"||S.lastVisit.get(c.id)||!c.since||diff(c.since,day)>14||diff(c.since,day)<0) continue;
    const k=facKey(c); if(seen.has(k)) continue; seen.add(k); out.push(c.id);
  }
  return out;
}

/* ---------- OPPORTUNITIES: big new accounts and quote alerts, all inferred from data (no extra entry by the salesman) ---------- */
const OPP_STAGES=["تعارف","عرض","تجربة","اعتماد"];
function oppsList(){
  const day=todayStr(), cfg=S.cfg, out=[], qBy=new Map(), vBy=new Map(), eBy=new Map();
  const add=(m,k,x)=>{ if(!m.has(k)) m.set(k,[]); m.get(k).push(x); };
  const kOf=cid=>{ const c=S.customers.get(cid); return c?facKey(c):null; };
  activeQuotes().forEach(q=>{ const k=kOf(q.customerId); if(k) add(qBy,k,q); });
  S.visits.forEach(v=>{ if(v.state!=="done") return; const seen=new Set(); [v.customerId,...(v.people||[]).map(p=>p.id)].forEach(id=>{ const k=kOf(id); if(k&&!seen.has(k)){ seen.add(k); add(vBy,k,v); } }); });
  S.events.forEach(e=>{ const k=kOf(e.cid); if(k) add(eBy,k,e); });
  const byType=new Map();
  for(const [k,fm] of S.facM){ if(fm.people.every(c=>(S.der.get(c.id)||{}).status==="current")&&fm.monthly>0){ const t=fm.fac.type; if(!byType.has(t)) byType.set(t,[]); byType.get(t).push(fm.monthly); } }
  for(const [k,fm] of S.facM){
    const qs=qBy.get(k)||[], vs=vBy.get(k)||[], es=eBy.get(k)||[], c=fm.people[0], name=fm.fac.name||cname(c);
    const dates=[...qs.map(q=>q.date),...vs.map(v=>v.date),...es.map(e=>e.date)].sort(), last=dates.length?dates[dates.length-1]:null;
    const firstQ=qs.length?qs.map(q=>q.date).sort()[0]:null;
    if(qs.length>=cfg.quoteAlert&&!qs.some(q=>q.status==="won")&&!(firstQ&&es.some(e=>e.date>=firstQ)))
      out.push({k,fm,c,name,kind:"nowin",u:93,n:qs.length,last,msg:"طلب "+qs.length+" تسعيرات بلا أي طلبية ناجحة. افهم السبب: السعر أم التوفر أم شيء آخر؟"});
    const allNew=fm.people.every(p=>(S.der.get(p.id)||{}).status==="new");
    if(allNew&&es.length<cfg.ordersToConvert&&(fm.tier==="A"||(es.length>=1&&fm.monthly>=cfg.valueGood*0.6))){
      const stage=es.length>=1?2:qs.length?1:vs.length?0:-1, idle=last?diff(last,day):null, stalled=idle==null||idle>=cfg.oppStallDays;
      const tm=byType.get(fm.fac.type), exp=tm&&tm.length>=3?Math.round(median(tm)):null;
      out.push({k,fm,c,name,kind:"opp",stage,u:88,stalled,idle:idle==null?0:idle,last,exp,n:es.length});
    }
  }
  return out;
}

/* ---------- TRAINING: how fast new accounts go from first visit to first order, and this month's "zero to loyal" project ---------- */
function trainHTML(){
  const day=todayStr(), firstV=new Map(), firstO=new Map(), nv=new Map();
  for(const v of S.visits){ if(v.state!=="done") continue; nv.set(v.customerId,(nv.get(v.customerId)||[]).concat(v.date)); const f=firstV.get(v.customerId); if(!f||v.date<f.date) firstV.set(v.customerId,v); }
  for(const e of S.events){ const f=firstO.get(e.cid); if(!f||e.date<f) firstO.set(e.cid,e.date); }
  let visited=0, ordered=0; const days=[], vis=[];
  for(const [cid,fv] of firstV){ if((fv.kind||stOf(cid))!=="new"||!S.customers.has(cid)) continue; visited++;
    const fo=firstO.get(cid); if(fo&&fo>=fv.date){ ordered++; days.push(diff(fv.date,fo)); vis.push(nv.get(cid).filter(d=>d<=fo).length); } }
  if(!visited) return "";
  const rate=Math.round(ordered/visited*100), md=days.length?Math.round(median(days)):null, av=vis.length?(vis.reduce((a,b)=>a+b,0)/vis.length).toFixed(1):null;
  /* this month's project: a brand-new account first visited this month that is still new, furthest along the funnel */
  let best=null;
  for(const [cid,fv] of firstV){ const c=S.customers.get(cid); if(!c||(fv.kind||stOf(cid))!=="new"||monthKey(fv.date)!==monthKey(day)||(S.der.get(cid)||{}).status!=="new") continue;
    const ev=S.events.filter(e=>e.cid===cid).length, qn=activeQuotes().filter(q=>q.customerId===cid).length, st=ev?2:qn?1:0, act=(nv.get(cid)||[]).slice().sort().pop();
    if(!best||st>best.st||(st===best.st&&act>best.act)) best={c,st,act}; }
  return '<section class="card"><h3>تدريب: من الصفر إلى الطلبية <small>'+visited+' عملاء جدد زُيروا</small></h3>'
   +'<div class="tiles"><div class="tile"><b>'+rate+'%</b><span>وصلوا إلى أول طلبية</span></div>'
   +'<div class="tile"><b>'+(md==null?"-":md)+'</b><span>يوماً من أول زيارة إلى أول طلبية (الوسيط)</span></div>'
   +'<div class="tile"><b>'+(av==null?"-":av)+'</b><span>زيارة في المتوسط حتى أول طلبية</span></div></div>'
   +(best?'<div class="credit on"><b>مشروع هذا الشهر:</b> '+esc(facOf(best.c).name||cname(best.c))+' · مرحلة «'+OPP_STAGES[best.st]+'». راجعوه معاً كل أسبوع: ما المرحلة؟ ما الاعتراض؟ ما الخطوة التالية؟</div>':'<div class="credit">لا يوجد بعد عميل جديد من هذا الشهر ليكون مشروع التدريب. زر منشأة جديدة وسجّلها.</div>')
   +'</section>';
}

  if(isNew&&!lv0&&!lm&&c.since&&diff(c.since,day)<=7) return {kind:"welcomeNew",u:97}; /* stays on the list for a week until it is sent */
  const qt=quoteTouch(c,day); if(qt&&qt.st[1]==="msg") return {kind:qt.st[2],item:qt.q.item,qid:qt.q.id,u:90+Math.min(qt.late,5)}; /* quote ladder runs on its own clock, not the general 7-day message throttle */
  if(lm&&diff(lm,day)<(isNew?3:7)) return null; /* new accounts can take a follow-up every 3 days, others every 7 */
  const fm=fmOf(c), d=S.der.get(c.id)||{};
  if(d.lastOrder){ const n=diff(d.lastOrder,day); if(n>=1&&n<=2) return {kind:"delivered",u:80}; }

  if(lv0&&lv0.result==="interested"){ const n=diff(lv0.date,day); if(n>=2&&n<=5) return {kind:"interestFollow",u:72}; }

    if(fm.dso>fm.gap*1.6&&fm.tier==="C") return {kind:"cold",u:40};
  }
  const lv=S.lastVisit.get(c.id);
  if(stg.startsWith("new")&&lv){ const n=diff(lv,day); if(n>=3&&n<=10) return {kind:"newbie",u:60}; }
  if(stg==="lapsed"&&lapsedFlow(c,day)==="msg") return {kind:"cold",u:60};
  if(stg==="current"&&msgOnly(c,day)&&visitDue(c,day)) return {kind:"checkin",u:55}; /* periodic follow-up by message instead of a visit */
  return null;
}

/* payment follow-up: an order is unpaid when the operations sync says so; the customer has 7 days from the order date.
   Day 4 = mid-term reminder, day 7 = last day, after that = late. Each reminder is a ready WhatsApp message, one tap to send. */
const PAY_DAYS=7, PAY_MID=4, PAY_STATUS="تم توريدها";
const PAY_LAB={wait:"قيد المهلة",mid:"تذكير منتصف المدة",end:"آخر يوم للسداد",late:"متأخرة"};
/* what is still owed on an order = revenue - paid so far (both come from the operations app); falls back to the order value until they arrive */
function payRemain(o){ const p=S.pay&&S.pay.get(o.id); if(p&&p.revenue!=null&&p.total!=null) return Math.max(0,Math.round((p.revenue-p.total)*100)/100); return o.value>0?o.value:0; }
/* the 7 days run from the supply date (Riyadh), not from the order date */
function paySuppliedDay(o){ const p=S.pay&&S.pay.get(o.id); return p&&p.suppliedAt?new Date(new Date(p.suppliedAt).getTime()+3*3600e3).toISOString().slice(0,10):o.date; }
function payDue(){
  const t=todayStr(), out=[], rank={end:0,late:1,mid:2,wait:3}; /* last day first, then late (most recently late first), then mid-term, then still within the term */
  for(const o of S.orders){
    const pp=S.pay&&S.pay.get(o.id); if(!pp||pp.paid!==false||pp.status!==PAY_STATUS) continue; /* payment is due only for orders already supplied at the operations app ("تم توريدها") and not paid in full */
    const c=S.customers.get(o.customerId); if(!c) continue;
    const sd=paySuppliedDay(o), rem=payRemain(o); if(pp.revenue!=null&&pp.total!=null&&rem<=0.005) continue;
    const age=diff(sd,t); if(age<0) continue;
    const stage=age>PAY_DAYS?"late":age===PAY_DAYS?"end":age>=PAY_MID?"mid":"wait";
    const kind=stage==="late"?"payLate":stage==="end"?"payEnd":"payMid";
    const mine=m=>m.customerId===c.id&&m.kind===kind&&(!o.orderNo||(m.body||"").includes(o.orderNo));
    /* mid-term and last-day reminders are sent once per order; a late one may repeat, but not twice in a day */
    const sent=stage==="late"?S.messages.some(m=>mine(m)&&m.date===t):stage==="wait"?false:S.messages.some(m=>mine(m)&&m.date>=sd);
    out.push({o,c,age,stage,kind,sent,rem,sd});
  }
  return out.sort((a,b)=>rank[a.stage]-rank[b.stage]||(a.stage==="late"?a.age-b.age:b.age-a.age)); /* every unpaid order past 7 days stays listed as late, however old */
}

/* ---------- PUSH NOTIFICATIONS: quote follow-up reminders reach the salesman's phone on time (sent by the quote-push edge function) ---------- */
const VAPID_PUB="BAWeiy2BW82jlgJV4RO9rjQM-gsji-C6Fo6zHkr0fzjRfFVLru2Fcza5n7lN_rVUQKt7xjXuZ4INGa_9TGYcCCk";
function pushSupported(){ return "serviceWorker" in navigator&&"PushManager" in window&&"Notification" in window; }
function b64uBytes(s){ const raw=atob((s+"=".repeat((4-s.length%4)%4)).replace(/-/g,"+").replace(/_/g,"/")); return Uint8Array.from([...raw].map(c=>c.charCodeAt(0))); }
function pushBannerHTML(){
  if(!pushSupported()||S.pushOn||Notification.permission!=="default") return ""; /* once allowed or blocked the banner never comes back */
  return '<section class="notice warnrow"><div><b>فعّل التنبيهات</b><br>لتصلك تذكيرات التسعيرات في وقتها.</div><button class="btn sm primary" data-act="push-on">تفعيل</button></section>';
}
async function pushSave(sub){ const j=sub.toJSON(); return guard(sb.from("push_subs").upsert({endpoint:j.endpoint,email:S.email,p256dh:j.keys.p256dh,auth:j.keys.auth}).select().single()); }
async function pushEnable(){
  try{
    if(await Notification.requestPermission()!=="granted"){ toast("لم تُفعَّل التنبيهات"); return; }
    const reg=await navigator.serviceWorker.ready; let sub=await reg.pushManager.getSubscription();
    if(!sub) sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64uBytes(VAPID_PUB)});
    const r=await pushSave(sub); if(r){ S.pushOn=true; S.mounted=null; toast("فُعّلت التنبيهات"); refresh(); }
  }catch(e){ toast("تعذّر تفعيل التنبيهات على هذا الجهاز"); }
}
function pushCheck(){ /* already subscribed on this device? keep the server copy fresh */
  if(S.pushChecked||!pushSupported()||Notification.permission!=="granted") return; S.pushChecked=true;
  navigator.serviceWorker.ready.then(async r=>{ let sub=await r.pushManager.getSubscription(); if(!sub){ try{ sub=await r.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64uBytes(VAPID_PUB)}); }catch(e){ return null; } } return sub; }).then(sub=>{ if(sub&&S.email){ const was=S.pushOn; S.pushOn=true; pushSave(sub); if(!was&&S.tab==="guide"){ S.mounted=null; refresh(); } } }).catch(()=>{});
}
function notifCardHTML(){
  let st, btn=""; setTimeout(pushCheck,0);
  if(!pushSupported()) st="هذا الجهاز أو المتصفح لا يدعم التنبيهات. على الآيفون أضِف التطبيق إلى الشاشة الرئيسية أولاً.";
  else if(Notification.permission==="denied") st="التنبيهات محظورة لهذا الموقع. افتح إعدادات المتصفح للموقع واسمح بالإشعارات ثم أعد فتح التطبيق.";
  else if(S.pushOn) { st="التنبيهات مفعّلة على هذا الجهاز."; btn='<button class="btn sm" data-act="push-test">جرّب تنبيهاً الآن</button>'; }
  else { st="لم تُفعَّل التنبيهات على هذا الجهاز بعد."; btn='<button class="btn sm primary" data-act="push-on">تفعيل</button>'; }
  return '<div class="guide list">'+foldSec("g-notif","alert","التنبيهات والتحديث","",'<div class="v-sub">'+st+'</div>'+(btn?'<div class="row">'+btn+'</div>':"")
    +'<div class="v-sub">الإصدار '+esc(APP_VERSION)+' <button class="btn sm ghost" data-act="check-update">تحقق من التحديث</button></div>',{tone:S.pushOn?"good":"warn"})+'</div>';
}
async function pushTest(){
  try{
    const reg=await navigator.serviceWorker.ready, sub=await reg.pushManager.getSubscription(); if(!sub){ toast("لا يوجد اشتراك على هذا الجهاز. فعّل التنبيهات أولاً"); return; }
    const r=await fetch(SUPABASE_URL+"/functions/v1/quote-push?test=1",{method:"POST",headers:{"Content-Type":"application/json",apikey:SUPABASE_KEY,Authorization:"Bearer "+SUPABASE_KEY},body:JSON.stringify({endpoint:sub.endpoint})});
    const j=await r.json().catch(()=>({})); toast(j.ok?"أُرسل تنبيه تجريبي، يصلك خلال ثوانٍ":"تعذّر الإرسال: "+String(j.error||r.status).slice(0,80));
  }catch(e){ toast("تعذّر الإرسال التجريبي"); }
}
/* in-app update: compare the version baked into this page with the live index.html; offer a button when they differ */
function showUpdate(){
  if($("#upd")) return; const d=document.createElement("div"); d.id="upd";
  d.style.cssText="position:fixed;inset-inline:12px;bottom:140px;z-index:60;background:#1c1c1e;color:#fff;border-radius:14px;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;box-shadow:0 6px 24px rgba(0,0,0,.28);font-size:14px";
  d.innerHTML='<span>يتوفر تحديث جديد للتطبيق</span><button class="btn sm primary" data-act="do-update">حدّث الآن</button>'; document.body.appendChild(d);
}
async function checkUpdate(manual){
  try{
    const r=await fetch(location.pathname+"?u="+Date.now(),{cache:"no-store"}); if(!r.ok) throw new Error("http");
    const m=(await r.text()).match(/const APP_VERSION="([^"]+)"/);
    if(m&&m[1]!==APP_VERSION){ showUpdate(); if(manual) toast("يوجد تحديث جديد"); } else if(manual) toast("لديك آخر إصدار");
  }catch(e){ if(manual) toast("تعذّر التحقق من التحديث"); }
}
async function doUpdate(){
  try{ if("caches" in window){ for(const k of await caches.keys()) await caches.delete(k); } if(navigator.serviceWorker){ for(const g of await navigator.serviceWorker.getRegistrations()) await g.update(); } }catch(e){}
  location.reload();
}
if(!window.__headless){
  window.addEventListener("load",()=>{ setTimeout(checkUpdate,4000); });
  setInterval(checkUpdate,600000);
  document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible") checkUpdate(); });
  if("serviceWorker" in navigator) navigator.serviceWorker.addEventListener("message",e=>{ const d=e.data||{}; if(d.type==="sw-updated") showUpdate(); if(d.type==="goto"){ setTab("today"); setTimeout(()=>{ const el=$("#quotes-sec"); if(el) el.scrollIntoView({block:"start"}); },500); } });
}
if("serviceWorker" in navigator) window.addEventListener("load",()=>{ navigator.serviceWorker.register("sw.js").catch(()=>{}); });
boot();
})();
</script>
</body>
