<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>زيارات بارتك</title>
<meta name="description" content="تخطيط وتسجيل زيارات مبيعات بارتك اليومية ومتابعتها مقابل أهداف الخطة">
<meta name="theme-color" content="#007AFF">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Readex+Pro:wght@500;600;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<style>
/* iOS-style design: grouped background, white cards, large type, 50px touch targets, tinted buttons, translucent bars, grabber sheets */
:root{
  --bg:#F2F2F7; --surface:#FFFFFF; --surface-2:#F2F2F7; --fill:rgba(118,118,128,.12); --line:rgba(60,60,67,.16);
  --ink:#000000; --ink-2:#55555C; --ink-3:#8A8A90;
  --accent:#007AFF; --accent-ink:#FFFFFF; --accent-soft:rgba(0,122,255,.12);
  --good:#1E8E3E; --good-soft:rgba(52,199,89,.16); --warn:#B26A00; --warn-soft:rgba(255,149,0,.16);
  --bad:#D70015; --bad-soft:rgba(255,59,48,.13); --new:#8944AB; --new-soft:rgba(175,82,222,.14);
  --orange:#FF9500; --green:#34C759;
  --bar:rgba(249,249,249,.86); --shadow:0 0 0 .5px rgba(60,60,67,.08),0 2px 12px rgba(0,0,0,.05);
  --scrim:rgba(0,0,0,.35); --seg-on:#FFFFFF;
  --f-display:-apple-system,BlinkMacSystemFont,"SF Arabic","IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;
  --f-body:-apple-system,BlinkMacSystemFont,"SF Arabic","IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;
  --r:20px; color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#000000; --surface:#1C1C1E; --surface-2:#2C2C2E; --fill:rgba(118,118,128,.24); --line:rgba(84,84,88,.55);
  --ink:#FFFFFF; --ink-2:#AEAEB2; --ink-3:#8E8E93;
  --accent:#0A84FF; --accent-ink:#FFFFFF; --accent-soft:rgba(10,132,255,.2);
  --good:#30D158; --good-soft:rgba(48,209,88,.18); --warn:#FF9F0A; --warn-soft:rgba(255,159,10,.18);
  --bad:#FF6961; --bad-soft:rgba(255,69,58,.2); --new:#BF5AF2; --new-soft:rgba(191,90,242,.2);
  --orange:#FF9F0A; --green:#30D158;
  --bar:rgba(28,28,30,.86); --shadow:0 0 0 .5px rgba(255,255,255,.05); --scrim:rgba(0,0,0,.6); --seg-on:#636366; color-scheme:dark;
}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.45;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
img{max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent-soft);outline-offset:1px}
#app{min-height:100%;display:flex;flex-direction:column}
.num{font-variant-numeric:tabular-nums}

/* top bar */
.top{position:sticky;top:0;z-index:20;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);padding:calc(8px + env(safe-area-inset-top,0px)) 16px 8px;display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:.5px solid var(--line)}
.brand{font-family:var(--f-display);font-weight:700;font-size:20px;line-height:1.2}
.brand small{display:flex;align-items:center;gap:6px;font-family:var(--f-body);font-weight:500;font-size:13px;color:var(--ink-3)}
.live{width:8px;height:8px;border-radius:50%;background:var(--ink-3);display:inline-block}
.live.on{background:var(--green)}
.who{display:flex;align-items:center;gap:8px;font-size:15px;color:var(--ink-2);min-width:0}
.who .av{width:34px;height:34px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-weight:700}
.who .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:30vw}
.badge{font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}

/* page */
.wrap{flex:1;width:100%;max-width:720px;margin-inline:auto;padding-inline:16px;padding-block:14px calc(104px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px}
.notice{background:var(--warn-soft);color:var(--ink);border-radius:var(--r);padding:14px 16px;font-size:16px}
.empty{background:var(--surface);border-radius:var(--r);padding:28px 18px;text-align:center;color:var(--ink-2);box-shadow:var(--shadow)}
.empty b{display:block;color:var(--ink);font-weight:700;font-size:19px;margin-bottom:6px}
h2.sec{font-family:var(--f-display);font-weight:700;font-size:22px;margin:8px 4px 0;display:flex;align-items:baseline;justify-content:space-between;gap:8px;letter-spacing:-.01em}
h2.sec small{font-family:var(--f-body);font-size:14px;color:var(--ink-3);font-weight:500}

/* login */
.login{max-width:420px;width:100%;margin:8vh auto 0;display:flex;flex-direction:column;gap:18px}
.login .logo{width:84px;height:84px;border-radius:22px}
.login h1{font-family:var(--f-display);font-weight:800;font-size:32px;margin:0;line-height:1.2;letter-spacing:-.02em}
.login p{margin:0;color:var(--ink-2)}
.install{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--accent-soft);border-radius:var(--r);padding:12px 14px;font-size:15px}

/* tab bar */
.tabs{position:fixed;bottom:0;inset-inline:0;z-index:30;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.tabs button{appearance:none;border:0;background:none;color:var(--ink-3);display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font-size:12px;font-weight:600;cursor:pointer;transition:color .15s}
.tabs button[aria-current="page"]{color:var(--accent)}
.tabs svg{width:28px;height:28px}

/* buttons */
.btn{appearance:none;border:0;background:var(--fill);color:var(--accent);border-radius:14px;padding:12px 18px;font-weight:600;font-size:17px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;min-height:52px;transition:transform .12s ease,opacity .12s ease}
.btn:active{transform:scale(.97);opacity:.8}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.sm{min-height:42px;padding:8px 14px;font-size:15px;border-radius:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row.grow>*{flex:1 1 0}

/* chips */
.chip{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:600;padding:2px 10px;border-radius:999px;white-space:nowrap;line-height:1.7}
.chip.current{background:var(--good-soft);color:var(--good)}
.chip.lapsed{background:var(--warn-soft);color:var(--warn)}
.chip.new{background:var(--new-soft);color:var(--new)}
.chip.muted{background:var(--fill);color:var(--ink-2)}
.chip.order{background:var(--good-soft);color:var(--good)}
.chip.interested{background:var(--accent-soft);color:var(--accent)}
.chip.notnow{background:var(--bad-soft);color:var(--bad)}
.chip.absent,.chip.missed{background:var(--fill);color:var(--ink-2)}
.chip.tier{min-width:26px;justify-content:center;font-weight:800}
.chip.tier-A{background:var(--ink);color:var(--bg)}
.chip.tier-B{background:var(--accent-soft);color:var(--accent)}
.chip.tier-C{background:var(--fill);color:var(--ink-3)}
.chip.int-high{background:var(--good-soft);color:var(--good)}
.chip.int-mid{background:var(--accent-soft);color:var(--accent)}
.chip.int-cooling{background:var(--warn-soft);color:var(--warn)}
.chip.int-low{background:var(--bad-soft);color:var(--bad)}

/* day header with activity rings */
.dayhead{background:var(--surface);border-radius:24px;box-shadow:var(--shadow);padding:16px;display:flex;flex-direction:column;gap:16px}
.daynav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.daynav .d{text-align:center;flex:1}
.daynav .d b{display:block;font-family:var(--f-display);font-weight:800;font-size:24px;letter-spacing:-.01em}
.daynav .d span{font-size:14px;color:var(--ink-3)}
.iconbtn{appearance:none;border:0;background:var(--fill);width:44px;height:44px;border-radius:50%;display:grid;place-items:center;cursor:pointer;color:var(--accent);flex:none;transition:transform .12s}
.iconbtn:active{transform:scale(.92)}
.iconbtn svg{width:20px;height:20px}
.rings{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ringbox{position:relative;display:flex;flex-direction:column;align-items:center;gap:0}
.ring{width:96px;height:96px}
.ring circle{fill:none;stroke-width:9;stroke-linecap:round;transform-origin:42px 42px;transform:rotate(-90deg)}
.rg-bg{stroke:var(--fill)}
.rg-fg{transition:stroke-dasharray .5s ease}
.rg-n{position:absolute;top:30px;font-family:var(--f-display);font-weight:800;font-size:30px;line-height:1}
.rg-l{font-weight:700;font-size:16px;margin-top:2px}
.rg-t{font-size:13px;color:var(--ink-3)}
.achline{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}

/* visit cards */
.list{display:flex;flex-direction:column;gap:12px}
.visit{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;display:flex;flex-direction:column;gap:10px;border-inline-start:6px solid var(--line)}
.visit.st-planned{border-inline-start-color:var(--accent)}
.visit.st-done{border-inline-start-color:var(--green)}
.visit.st-missed{border-inline-start-color:var(--bad-soft);opacity:.8}
.v-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.v-name{font-weight:700;font-size:20px;line-height:1.3;min-width:0;letter-spacing:-.01em}
.v-name button{all:unset;cursor:pointer}
.v-sub{font-size:15px;color:var(--ink-2)}
.v-time{font-variant-numeric:tabular-nums;font-size:15px;font-weight:600;color:var(--ink-2);white-space:nowrap}
.v-meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:15px;color:var(--ink-2)}
.v-note{font-size:16px;background:var(--surface-2);border-radius:14px;padding:10px 12px;white-space:pre-wrap;overflow-wrap:anywhere}
.v-note .k{display:block;font-size:12px;font-weight:700;color:var(--ink-3);margin-bottom:2px}
.coachnote{font-size:16px;background:var(--accent-soft);border-radius:14px;padding:10px 12px;white-space:pre-wrap;overflow-wrap:anywhere}
.coachnote .k{display:block;font-size:12px;font-weight:700;color:var(--accent);margin-bottom:2px}
.v-actions{display:flex;gap:8px;flex-wrap:wrap}
.v-actions .btn{flex:1 1 auto}

/* customers */
.searchbar{display:flex;gap:10px}
.input{width:100%;border:1px solid transparent;background:var(--surface);border-radius:14px;padding:12px 14px;min-height:52px;font-size:17px;box-shadow:var(--shadow)}
.input:focus{outline:none;border-color:var(--accent)}
.sheet .input{background:var(--surface-2);box-shadow:none}
textarea.input{min-height:110px;resize:vertical;line-height:1.5}
.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.filters button{appearance:none;border:0;background:var(--fill);border-radius:999px;padding:8px 16px;font-size:15px;font-weight:600;cursor:pointer;white-space:nowrap;color:var(--ink-2)}
.filters button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.cust{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:14px 16px;display:flex;align-items:center;gap:14px;cursor:pointer;text-align:start;border:0;width:100%;transition:transform .12s}
.cust:active{transform:scale(.985)}
.cust .avatar{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:19px;flex:none}
.avatar.current{background:var(--good-soft);color:var(--good)}
.avatar.lapsed{background:var(--warn-soft);color:var(--warn)}
.avatar.new{background:var(--new-soft);color:var(--new)}
.cust .c-main{flex:1;min-width:0}
.cust .c-name{font-weight:700;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.cust .c-sub{font-size:15px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.cust .c-side{text-align:end;font-size:13px;color:var(--ink-3);display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:none}
.due{color:var(--bad);font-weight:600}

/* dashboard */
.card{background:var(--surface);border-radius:24px;box-shadow:var(--shadow);padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.card h3{margin:0;font-family:var(--f-display);font-weight:800;font-size:20px;display:flex;justify-content:space-between;align-items:baseline;gap:8px;letter-spacing:-.01em}
.card h3 small{font-family:var(--f-body);font-weight:500;font-size:14px;color:var(--ink-3)}
.kpi{display:flex;flex-direction:column;gap:6px}
.kpi .kl{display:flex;justify-content:space-between;gap:8px;font-size:16px}
.kpi .kl b{font-variant-numeric:tabular-nums;font-weight:700}
.kpi .kl b small{color:var(--ink-3);font-weight:500}
.bar{position:relative;height:10px;border-radius:99px;background:var(--fill)}
.bar>i{position:absolute;inset-block:0;inset-inline-start:0;border-radius:99px;background:var(--accent)}
.bar>i.ok{background:var(--green)}
.bar>i.low{background:var(--orange)}
.bar>em{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink-3);border-radius:2px}
.kpi .hint{font-size:13px;color:var(--ink-3)}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tile{background:var(--surface-2);border-radius:16px;padding:14px}
.tile b{display:block;font-family:var(--f-display);font-weight:800;font-size:28px;font-variant-numeric:tabular-nums}
.tile span{font-size:14px;color:var(--ink-2)}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--ink-3);font-size:10px;font-family:var(--f-body)}
.feed{display:flex;flex-direction:column;gap:12px}
.feed .visit{box-shadow:none;background:var(--surface-2)}
.split{display:grid;grid-template-columns:1fr;gap:16px}
@media (min-width:640px){.split{grid-template-columns:1fr 1fr}.tiles{grid-template-columns:repeat(4,1fr)}}
.credit{background:var(--surface-2);border-radius:14px;padding:12px 14px;font-size:15px;color:var(--ink-2)}
.credit.on{background:var(--good-soft);color:var(--ink)}

/* guide */
.guide details{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:0}
.guide summary{list-style:none;cursor:pointer;padding:16px;font-family:var(--f-display);font-weight:700;font-size:18px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.guide summary::-webkit-details-marker{display:none}
.guide summary::after{content:"+";font-size:26px;color:var(--accent);line-height:1}
.guide details[open] summary::after{content:"−"}
.guide .gb{padding:0 16px 16px;display:flex;flex-direction:column;gap:12px;font-size:16px;max-width:65ch}
.guide ol,.guide ul{margin:0;padding-inline-start:22px;display:flex;flex-direction:column;gap:8px}
.guide .say{background:var(--accent-soft);border-radius:12px;padding:10px 12px}
.guide .obj{background:var(--surface-2);border-radius:14px;padding:12px 14px}
.guide .obj b{display:block;margin-bottom:2px}

/* sheets */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:50;display:flex;align-items:flex-end;justify-content:center;-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
.sheet{background:var(--surface);width:100%;max-width:720px;max-height:94%;border-radius:28px 28px 0 0;display:flex;flex-direction:column;box-shadow:0 -8px 40px rgba(0,0,0,.18)}
.sheet::before{content:"";width:40px;height:5px;border-radius:3px;background:var(--line);margin:8px auto 0;flex:none}
.sheet-h{padding:10px 20px 12px;display:flex;align-items:flex-start;justify-content:space-between;gap:10px;border-bottom:.5px solid var(--line)}
.sheet-h h2{margin:0;font-family:var(--f-display);font-weight:800;font-size:24px;line-height:1.25;letter-spacing:-.01em}
.sheet-h p{margin:2px 0 0;font-size:15px;color:var(--ink-2)}
.sheet-b{overflow-y:auto;padding:16px 20px;display:flex;flex-direction:column;gap:16px;overscroll-behavior:contain}
.sheet-f{padding:12px 20px calc(14px + env(safe-area-inset-bottom,0px));border-top:.5px solid var(--line);display:flex;gap:10px;flex-wrap:wrap}
.sheet-f .btn{flex:1 1 auto}
.field{display:flex;flex-direction:column;gap:8px}
.field>label,.field>.lab{font-size:15px;font-weight:600;color:var(--ink-2)}
.field .help{font-size:13px;color:var(--ink-3)}
.seg{display:grid;grid-template-columns:repeat(2,1fr);gap:2px;background:var(--fill);padding:3px;border-radius:14px}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label{border-radius:11px;padding:10px 8px;text-align:center;font-weight:600;font-size:16px;cursor:pointer;min-height:48px;display:flex;align-items:center;justify-content:center;gap:6px;color:var(--ink-2);transition:background .15s}
.seg input:checked+label{background:var(--seg-on);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.14);font-weight:700}
.seg input:focus-visible+label{outline:3px solid var(--accent-soft)}
.checks{display:flex;flex-direction:column;background:var(--surface-2);border-radius:16px;padding:4px}
.checks label{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:12px;cursor:pointer;font-size:16px}
.checks input{width:24px;height:24px;accent-color:var(--accent);flex:none}
.err{color:var(--bad);font-size:15px;font-weight:600;background:var(--bad-soft);border-radius:14px;padding:12px 14px}
.pick{display:flex;align-items:center;gap:12px;padding:12px 2px;border-bottom:.5px solid var(--line)}
.pick:last-child{border-bottom:0}
.pick .p-main{flex:1;min-width:0}
.pick .p-name{font-weight:700;font-size:17px}
.pick .p-sub{font-size:14px;color:var(--ink-2)}
.pick .tog{appearance:none;width:48px;height:48px;border-radius:50%;border:0;background:var(--fill);display:grid;place-items:center;cursor:pointer;color:var(--accent);flex:none;transition:transform .12s}
.pick .tog:active{transform:scale(.92)}
.pick .tog.on{background:var(--accent);color:var(--accent-ink)}
.pick .tog.lock{background:var(--good-soft);color:var(--good)}
.pick .tog svg{width:22px;height:22px}
.grp-h{font-size:13px;font-weight:700;color:var(--ink-3);margin-top:8px;text-transform:none}
.kv{display:grid;grid-template-columns:auto 1fr;gap:10px 16px;font-size:16px;margin:0}
.kv dt{color:var(--ink-3)}
.kv dd{margin:0;font-weight:600;min-width:0;overflow-wrap:anywhere}
.phone{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-variant-numeric:tabular-nums;direction:ltr;justify-content:flex-end}

/* smart planning */
.balance{display:flex;flex-direction:column;gap:8px}
.bbar{display:flex;gap:3px;height:10px;border-radius:99px;overflow:hidden;background:var(--fill)}
.bbar i{display:block;height:100%}
.bbar .b-current{background:var(--green)}.bbar .b-lapsed{background:var(--orange)}.bbar .b-new{background:var(--new)}
.bleg{font-size:14px;color:var(--ink-2);display:flex;flex-wrap:wrap;gap:2px 14px}
.bwarn{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px;font-size:14px}
.bwarn li{padding-inline-start:16px;position:relative;color:var(--ink-2)}
.bwarn li::before{content:"";position:absolute;inset-inline-start:0;top:.55em;width:8px;height:8px;border-radius:50%;background:var(--ink-3)}
.bwarn li.warn{color:var(--warn);font-weight:600}.bwarn li.warn::before{background:var(--orange)}
.carry{display:flex;flex-direction:column;gap:12px}
.c-why{display:block;font-size:13px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.why{font-size:14px;color:var(--accent);font-weight:600}
.star{color:var(--orange)}
.prio{display:flex;flex-direction:column;gap:10px}
.prio .pi{display:flex;gap:12px;align-items:center;padding:12px 14px;background:var(--surface-2);border-radius:16px}

function rowToVisit(r){return {id:r.id, customerId:r.customer_id, date:r.date, time:r.time||"", kind:r.kind||"", purpose:r.purpose||"", state:r.state, result:r.result||"", channel:r.channel||"visit", notes:r.notes||"", next:{text:r.next_text||"", date:r.next_date||""}, checks:r.checks||{}, coach:{text:r.coach_text||"", at:r.coach_at}, by:r.by_email, doneBy:r.done_by, doneAt:r.done_at||"", createdAt:r.created_at||"", unplanned:!!r.unplanned, goal:r.goal||"", goalMet:r.goal_met||"", reason:r.reason||"", people:Array.isArray(r.people)?r.people:[]};}
function rowToFac(r){return {id:r.id, name:r.name||"", type:r.type||"أخرى", area:r.area||"", location:r.location||"", branches:r.branches==null?1:Number(r.branches), fleet:Number(r.fleet||0), note:r.note||"", marginScore:r.margin_score==null?null:Number(r.margin_score)};}
function rowToOrder(r){return {id:r.id, visitId:r.visit_id||null, customerId:r.customer_id||null, facilityId:r.facility_id||null, date:r.date, orderNo:r.order_no||"", value:r.value==null?null:Number(r.value), status:r.status||"confirmed", source:r.source||"manual"};}
function rowToQuote(r){return {id:r.id, customerId:r.customer_id||null, date:r.date, item:r.item||"", value:r.value==null?null:Number(r.value), status:r.status||"open", lostReason:r.lost_reason||"", orderId:r.order_id||null, closedAt:r.closed_at||"", by:r.created_by};}
function putMsg(r){ if(!S.messages.some(x=>x.id===r.id)) S.messages.push({id:r.id,customerId:r.customer_id||null,kind:r.kind||"",date:r.date,by:r.created_by}); }
function putQuote(r){ const q=rowToQuote(r); const i=S.quotes.findIndex(x=>x.id===q.id); if(i>=0) S.quotes[i]=q; else S.quotes.push(q); }
function putFac(r){ S.facilities.set(r.id,rowToFac(r)); }
function putOrder(r){ const o=rowToOrder(r); const i=S.orders.findIndex(x=>x.id===o.id); if(i>=0) S.orders[i]=o; else S.orders.push(o); }
function dropOrder(id){ S.orders=S.orders.filter(x=>x.id!==id); S.costs.delete(id); }
function putVisit(r){ const v=rowToVisit(r); const i=S.visits.findIndex(x=>x.id===v.id); if(i>=0) S.visits[i]=v; else S.visits.push(v); S.visitById.set(v.id,v); }
function dropVisit(id){ S.visits=S.visits.filter(x=>x.id!==id); S.visitById.delete(id); }
function putCust(r){ S.customers.set(r.id,rowToCust(r)); }

/* ---------- status engine ---------- */
/* base: current | lapsed | new (status at import / creation); since: date that status was confirmed.
   Orders are the visits recorded with result "order". */
function derive(c, today, cfg, od){
  const N = cfg.ordersToConvert, L = cfg.lapsedDays;
  let established = c.base!=="new", convertedOn=null, recovered=[];
  let ref = c.base==="current" ? (c.since||null) : null;
  let n=0;
  for(const d of od){
    n++;
    if(!established){ if(n>=N){established=true;convertedOn=d;} ref=d; continue; }
    if(!ref || diff(ref,d)>=L) recovered.push(d);
    if(!ref || d>ref) ref=d;
  }
  let status;
  if(!established) status="new";
  else status = (!ref || diff(ref,today)>=L) ? "lapsed" : "current";
  return {status, count:od.length, lastOrder:od.length?od[od.length-1]:null, convertedOn, recovered, toGo:Math.max(0,N-od.length)};
}
/* every order, from the orders table, plus legacy "order" visits that have no orders row */
function buildEvents(){
  const ev=[], has=new Set();
  for(const o of S.orders){ if(o.status==="cancelled"||!o.customerId) continue; ev.push({cid:o.customerId,date:o.date,value:o.value||0,oid:o.id}); if(o.visitId) has.add(o.visitId+"|"+o.customerId); }
  for(const v of S.visits){
    if(v.state!=="done") continue;
    if(v.result==="order" && !has.has(v.id+"|"+v.customerId)) ev.push({cid:v.customerId,date:v.date,value:0,legacy:true});
    for(const p of v.people||[]) if(p.result==="order" && !has.has(v.id+"|"+p.id)) ev.push({cid:p.id,date:v.date,value:0,legacy:true});
  }
  return ev;
}
function recompute(){
  const t=todayStr(), ob=new Map();
  S.events=buildEvents();
  for(const e of S.events){ if(!ob.has(e.cid)) ob.set(e.cid,[]); ob.get(e.cid).push(e.date); }
  S.der = new Map();
  for(const c of S.customers.values()) S.der.set(c.id, derive(c,t,S.cfg,(ob.get(c.id)||[]).sort()));
  S.lastVisit = new Map();
  for(const c of S.customers.values()) if(c.lastVisit) S.lastVisit.set(c.id,c.lastVisit);
  const bump=(id,d)=>{ const cur=S.lastVisit.get(id); if(!cur||d>cur) S.lastVisit.set(id,d); };
  for(const v of S.visits){ if(v.state!=="done") continue; bump(v.customerId,v.date); for(const p of v.people||[]) bump(p.id,v.date); }
  computeFacilities();
}

/* ---------- facilities, account tier, interest ---------- */
function clamp(x){return Math.max(0,Math.min(100,x));}
function median(a){const s=a.slice().sort((x,y)=>x-y),m=s.length>>1;return s.length%2?s[m]:(s[m-1]+s[m])/2;}
function ftName(t){return FT.has(t)?t:(LEGACY_FT[t]||"أخرى");}
function facKey(c){return c.facilityId||("solo:"+c.id);}
function facOf(c){ const f=c.facilityId&&S.facilities.get(c.facilityId); return f||{id:null,name:c.org||c.person||"",type:ftName(c.type),area:c.area||"",location:"",branches:1,fleet:0,note:"",marginScore:null}; }
function capOf(f){ const t=FT.get(ftName(f.type))||FT.get("أخرى"); let c=t[1]; if(f.branches>=3) c+=1; if(f.fleet>=100) c+=1; return Math.min(5,c); }
function famOf(f){ return (FT.get(ftName(f.type))||FT.get("أخرى"))[2]; }
function resFor(v,k,keyOf){ if(keyOf.get(v.customerId)===k) return v.result; const p=(v.people||[]).find(x=>keyOf.get(x.id)===k); return p?p.result:v.result; }
function computeFacilities(){
  const t=todayStr(), t90=addDays(t,-90), cfg=S.cfg;
  const people=new Map(), keyOf=new Map(), evBy=new Map(), visBy=new Map();
  for(const c of S.customers.values()){ const k=facKey(c); keyOf.set(c.id,k); if(!people.has(k)) people.set(k,[]); people.get(k).push(c); }
  S.facPeople=people;
  for(const e of S.events){ const k=keyOf.get(e.cid); if(!k) continue; if(!evBy.has(k)) evBy.set(k,[]); evBy.get(k).push(e); }
  for(const v of S.visits){
    if(v.state!=="done") continue;
    const ks=new Set(); const k0=keyOf.get(v.customerId); if(k0) ks.add(k0);
    for(const p of v.people||[]){ const k=keyOf.get(p.id); if(k) ks.add(k); }
    for(const k of ks){ if(!visBy.has(k)) visBy.set(k,[]); visBy.get(k).push(v); }
  }
  const RW={order:1,interested:.6,notnow:-.8,absent:-.15}, rank={A:3,B:2,C:1};
  S.facM=new Map();
  for(const [k,ppl] of people){
    const f=facOf(ppl[0]), evs=evBy.get(k)||[], vis=visBy.get(k)||[];
    const ev90=evs.filter(e=>e.date>t90), val90=ev90.reduce((s,e)=>s+(e.value||0),0);
    const valueS=evs.some(e=>e.value>0)?clamp(val90/3/cfg.valueGood*100):null;
    const actS=clamp(ev90.length/cfg.activityGood*100);
    const cap=capOf(f), capS=cap/5*100;
    const dates=[...new Set(evs.map(e=>e.date))].sort();
    const last=dates.length?dates[dates.length-1]:null, dso=last?diff(last,t):null;
    let gap=null, ratio=null;
    if(dates.length>=3){ const gs=[]; for(let i=1;i<dates.length;i++) gs.push(diff(dates[i-1],dates[i])); gap=Math.max(3,Math.round(median(gs))); ratio=dso/gap; }
    let num=0, den=0;
    for(const v of vis){ const age=diff(v.date,t); if(age>90) continue; const r=resFor(v,k,keyOf); if(!(r in RW)) continue; const w=Math.pow(.5,age/21); num+=RW[r]*w; den+=w; }
    let score=den?50+50*num/den:(evs.length?50:null);
    if(score!=null){
      if(ratio!=null){ if(ratio>2.5) score-=35; else if(ratio>1.6) score-=20; else if(ratio>1.2) score-=8; else if(ratio<=1) score+=8; }
      else if(dso!=null && dso>cfg.lapsedDays*0.75) score-=15;
      score=clamp(score);
    }
    const level=score==null?null:score>=70?"high":score>=45?"mid":score>=25?"cooling":"low";
    const fading=(ratio!=null&&ratio>1.3)||((level==="cooling"||level==="low")&&evs.length>0);
    const axes={value:valueS,margin:f.marginScore,activity:actS,cap:capS,interest:score};
    const wavg=keys=>{ let s=0,w=0; for(const q of keys) if(axes[q]!=null){ s+=axes[q]*WEIGHTS[q]; w+=WEIGHTS[q]; } return w?s/w:0; };
    const perf=wavg(["value","margin","activity","interest"]), comp=wavg(["value","margin","activity","cap","interest"]);
    const perfTier=perf>=65?"A":perf>=38?"B":"C", capTier=cap>=4?"A":cap>=2?"B":"C";
    const tier=rank[perfTier]>=rank[capTier]?perfTier:capTier;
    S.facM.set(k,{key:k,fac:f,people:ppl,tier,perfTier,capTier,comp,perf,axes,cap,score,level,fading,gap,dso,last,orders90:ev90.length,monthly:val90/3,evCount:evs.length});
  }
}
function fmOf(c){ return c?S.facM.get(facKey(c))||null:null; }
function tierChip(c){ const m=fmOf(c); return m?'<span class="chip tier tier-'+m.tier+'" title="فئة العميل حسب حجم المنشأة ونشاطها وقيمة طلباتها">'+m.tier+'</span>':""; }
function intChip(c){ const m=fmOf(c); return m&&m.level?'<span class="chip int-'+m.level+'">'+LEVEL[m.level]+'</span>':""; }
function stageOf(cid){ const d=S.der.get(cid)||{status:"new",count:0}; if(d.status==="current") return "current"; if(d.status==="lapsed") return "lapsed"; return d.count>=2?"new2":d.count===1?"new1":"new0"; }
function defaultGoal(cid){ return STAGES[stageOf(cid)].goals[0]; }
/* Saudi mobile numbers: accept Arabic digits, +966 / 00966, and a missing leading zero */
function normPhone(p){ let d=String(p||"").replace(/[٠-٩]/g,x=>"٠١٢٣٤٥٦٧٨٩".indexOf(x)).replace(/[^\d+]/g,""); d=d.replace(/^(\+|00)?966/,"0"); if(/^5\d{8}$/.test(d)) d="0"+d; return d; }
function phoneOk(p){ return /^05\d{8}$/.test(p); }
function normName(s){ return String(s||"").replace(/[ً-ٟـ]/g,"").replace(/[أإآ]/g,"ا").replace(/ة/g,"ه").replace(/ى/g,"ي").replace(/\s+/g," ").trim().toLowerCase(); }
/* what is missing in a customer record (used by the forms and the data-quality screen) */
function custIssues(c){
  const f=facOf(c), out=[];
  if(!c.person||c.person==="—") out.push("اسم الشخص");
  if(!c.title) out.push("المنصب");
  if(!f.name) out.push("اسم المنشأة");
  if(!(f.area||c.area)) out.push("المنطقة");
  if(!phoneOk(normPhone(c.phone))) out.push("رقم جوال صحيح");
  return out;
}
function stOf(id){const d=S.der.get(id);return d?d.status:"new";}
function chipFor(id){
  const d=S.der.get(id); if(!d) return "";
  if(d.status==="new") return '<span class="chip new">جديد · '+d.count+'/'+S.cfg.ordersToConvert+'</span>';
  return '<span class="chip '+d.status+'">'+ST[d.status]+'</span>';
}

/* ---------- data actions ---------- */
function visitsOn(day){return S.visits.filter(v=>v.date===day).sort((a,b)=>{
  const ta=a.time||"99:99", tb=b.time||"99:99"; if(ta!==tb) return ta<tb?-1:1; return (a.createdAt||"")<(b.createdAt||"")?-1:1; });}
function visitFor(cid, day){return S.visits.find(v=>v.customerId===cid && v.date===day);}
function defaultPurpose(cid){const d=S.der.get(cid)||{status:"new",count:0};return d.status==="current"?"order":d.status==="lapsed"?"recover":(d.count>0?"followup":"intro");}

async function createVisit(cid, day, extra){
  const row = Object.assign({id:uuid(), customer_id:cid, date:day, time:"", kind:stOf(cid), purpose:defaultPurpose(cid), goal:defaultGoal(cid), state:"planned", by_email:S.email}, extra||{});
  const r = await guard(sb.from("visits").insert(row).select().single());
  if(r){ putVisit(r); refresh(); return r.id; }
  return null;
}
async function updateVisit(id, patch, okMsg){
  const r = await guard(sb.from("visits").update(patch).eq("id",id).select().single(), okMsg);
  if(r){ putVisit(r); refresh(); }
  return !!r;
}
async function removeVisit(id){
  const v=S.visitById.get(id); if(!v) return false;
  if(v.state==="done"){ toast("لا يمكن حذف زيارة مُنجزة، عدّل نتيجتها بدلاً من ذلك."); return false; }
  const r = await guard(sb.from("visits").delete().eq("id",id), "أُزيلت من الخطة");
  if(r){ dropVisit(id); refresh(); }
  return !!r;
}

/* ---------- smart planning ---------- */
function weekInfo(day){const ws=weekStart(day);return {ws,we:addDays(ws,6)};}
function workDaysLeft(day){let n=0;const we=weekInfo(day).we;for(let d=day;d<=we;d=addDays(d,1)) if(dow(d)!==5) n++;return Math.max(1,n);}
function planCtx(day){
  const {ws,we}=weekInfo(day);
  const visitedWeek=new Set(), carry=new Map(), follow=new Map(), latest=new Map();
  for(const v of S.visits){
    if(v.state==="done"){
      if(v.date>=ws&&v.date<=we&&v.date!==day) visitedWeek.add(v.customerId);
      const o=latest.get(v.customerId); if(!o||v.date>o.date) latest.set(v.customerId,v);
    } else if(v.state==="planned" && v.date<day && diff(v.date,day)<=21){
      const o=carry.get(v.customerId); if(!o||v.date>o.date) carry.set(v.customerId,v);
    }
  }
  for(const v of latest.values()){
    if(v.next&&v.next.date&&v.next.date<=day && !S.visits.some(x=>x.customerId===v.customerId&&x.date>v.date&&x.state!=="missed")) follow.set(v.customerId,v);
  }
  return {ws,we,visitedWeek,carry,follow};
}
/* priority score and a one-line reason for each customer */
function scoreCustomer(c, day, ctx){
  const s=stOf(c.id), d=S.der.get(c.id)||{count:0,lastOrder:null};
  const lv=S.lastVisit.get(c.id)||"";
  const since=lv?Math.max(0,diff(lv,day)):99;
  const cv=ctx.carry.get(c.id), fv=ctx.follow.get(c.id);
  let score=0, reason="", kind=s;
  if(cv){ score=100; kind="carry"; reason="مرحّلة من "+dShort(cv.date); }
  else if(fv){ score=95; kind="follow"; reason="متابعة مستحقة"+(fv.next.text?": "+shorten(fv.next.text,28):""); }
  else if(s==="current"){
    if(ctx.visitedWeek.has(c.id)){ score=20+Math.min(since,14); kind="current-done"; reason="زُير هذا الأسبوع"; }
    else { score=60+Math.min(since,14)*2; reason=lv?"لم يُزر منذ "+since+" يوماً":"لم يُزر بعد"; }
  } else if(s==="lapsed"){
    const lo=d.lastOrder, ld=lo?Math.max(0,diff(lo,day)):0;
    score=35+(lo?Math.max(0,15-Math.floor(Math.max(0,ld-S.cfg.lapsedDays)/6)):8);
    reason=lo?"آخر طلبية قبل "+ld+" يوماً":"سابق للاسترجاع";
    if(lv&&since<7) reason+=" · زُير قبل "+since+" أيام";
    if(lv&&since<4) score-=20;
  } else {
    score=40+d.count*12;
    reason=d.count>0?"جديد · "+d.count+"/"+S.cfg.ordersToConvert+" طلبيات":(lv?"جديد · لم يطلب بعد":"جديد · لم يُزر");
    if(d.count===0&&lv&&since<3) score-=20;
  }
  score+=Math.min(d.count,10)*0.5;
  if(c.important){ score+=30; reason="عميل مهم · "+reason; }
  if(!cv&&!fv&&lv&&since<=1) score-=30;
  const fm=fmOf(c);
  if(fm){
    if(fm.tier==="A") score+=14; else if(fm.tier==="B") score+=6;
    if(fm.fading && fm.tier!=="C" && !cv && !fv){ score+=18; reason="⚠ اهتمامه يبرد · "+reason; }
    if(fm.tier==="A") reason="فئة A · "+reason;
  }
  return {score,reason,kind,carryVisit:cv||null,followVisit:fv||null};
}
function candidates(day){
  const ctx=planCtx(day), out=[], planned=new Set();
  for(const v of S.visits) if(v.date===day&&v.state!=="missed"){ const c=S.customers.get(v.customerId); if(c) planned.add(facKey(c)); }
  for(const c of S.customers.values()){
    if(visitFor(c.id,day)) continue;
    if(c.facilityId && planned.has(facKey(c))) continue; /* one visit per facility per day */
    out.push(Object.assign({id:c.id,c,fk:facKey(c),area:c.area||""},scoreCustomer(c,day,ctx)));
  }
  return out;
}
/* picks the day's visits: carry-overs, due follow-ups, new-customer quota, weekly current visits, lapsed, then best score;
   groups the result by area so the route is short */
function suggestPlan(day, areaPref){
  const cfg=S.cfg, inPlan=visitsOn(day).filter(v=>v.state!=="missed");
  const slots=Math.max(0,cfg.dailyTarget-inPlan.length);
  const cands=candidates(day), desc=(a,b)=>b.adj-a.adj;
  cands.forEach(x=>x.adj=x.score);
  let area=areaPref||"";
  if(!area){
    const sum=new Map(); cands.slice().sort((a,b)=>b.score-a.score).slice(0,Math.max(slots*2,12)).forEach(x=>{if(x.area) sum.set(x.area,(sum.get(x.area)||0)+x.score);});
    let best=0; sum.forEach((v,k)=>{if(v>best){best=v;area=k;}});
  }
  cands.forEach(x=>{ if(x.area) x.adj+= x.area===area ? (areaPref?30:12) : (areaPref?-25:0); });
  const pick=[], used=new Set(), usedF=new Set();
  const take=(arr,n)=>{for(const x of arr){ if(pick.length>=slots||n<=0) break; if(used.has(x.id)||(x.c.facilityId&&usedF.has(x.fk))) continue; pick.push(x); used.add(x.id); usedF.add(x.fk); n--; }};
  const by=k=>cands.filter(x=>x.kind===k).sort(desc);
  const left=workDaysLeft(day), {ws,we}=weekInfo(day);
  const weekNew=S.visits.filter(v=>(v.kind||stOf(v.customerId))==="new"&&v.date>=ws&&v.date<=we&&v.state!=="missed").length;
  const newToday=Math.ceil(Math.max(0,cfg.weeklyNew-weekNew)/left);
  const curDue=by("current");
  const nOf=st=>pick.filter(x=>stOf(x.id)===st).length;
  take(by("carry"),99); take(by("follow"),99);
  take(by("new"),newToday);
  take(curDue,Math.max(0,Math.min(Math.ceil(curDue.length/left),Math.ceil(slots*0.6)-nOf("current"))));
  take(by("lapsed"),Math.max(0,Math.max(2,Math.ceil(slots*0.3))-nOf("lapsed")));
  /* fill the rest by score, without letting one type take more than 70% of the day; relax if nothing else is left */
  const cap=Math.ceil(slots*0.7);
  take(cands.filter(x=>!used.has(x.id)&&nOf(stOf(x.id))<cap).sort(desc),99);
  take(cands.filter(x=>!used.has(x.id)).sort(desc),99);
  const counts=new Map(); pick.forEach(x=>{ if(x.area) counts.set(x.area,(counts.get(x.area)||0)+1); });
  const rank=a=>!a?9999:a===area?-1000:-(counts.get(a)||0);
  pick.sort((a,b)=>{const ra=rank(a.area),rb=rank(b.area); return ra!==rb?ra-rb:(a.area||"").localeCompare(b.area||"")||desc(a,b);});
  return {picks:pick,area,slots,inPlan:inPlan.length};
}
async function addPlanned(day, picks){
  const now=Date.now();
  const rows=picks.map((p,i)=>({id:uuid(),customer_id:p.id,date:day,time:"",kind:stOf(p.id),
    purpose:p.kind==="follow"?"followup":p.kind==="carry"?(p.carryVisit.purpose||"order"):defaultPurpose(p.id),
    goal:p.kind==="carry"&&p.carryVisit.goal?p.carryVisit.goal:defaultGoal(p.id),
    state:"planned",by_email:S.email,created_at:new Date(now+i).toISOString(),
    from_visit:p.kind==="carry"?p.carryVisit.id:p.kind==="follow"?p.followVisit.id:null}));
  if(!rows.length) return 0;
  const ins=await guard(sb.from("visits").insert(rows).select());
  if(!ins) return 0;
  ins.forEach(putVisit);
  const oldIds=picks.filter(p=>p.kind==="carry").map(p=>p.carryVisit.id);
  if(oldIds.length){ const up=await guard(sb.from("visits").update({state:"missed"}).in("id",oldIds).select()); if(up&&up.forEach) up.forEach(putVisit); }
  refresh();
  return ins.length;
}
function carryItems(day){
  const ctx=planCtx(day), out=[];
  for(const [cid,v] of ctx.carry){ if(visitFor(cid,day)) continue; const c=S.customers.get(cid); if(c) out.push({id:cid,kind:"carry",carryVisit:v,c}); }
  return out;
}
/* plan composition: mix of current / lapsed / new and warnings against the weekly targets */
function balanceHTML(ids, day){
  const cfg=S.cfg, n=ids.length, cnt={current:0,lapsed:0,new:0};
  ids.forEach(id=>{const k=stOf(id); if(cnt[k]!=null) cnt[k]++;});
  const ctx=planCtx(day), left=workDaysLeft(day), inSet=new Set(ids), w=[];
  const weekNew=S.visits.filter(v=>(v.kind||stOf(v.customerId))==="new"&&v.date>=ctx.ws&&v.date<=ctx.we&&v.date!==day&&v.state!=="missed").length+cnt.new;
  const needNew=cfg.weeklyNew-weekNew;
  const lt=left===1?"بقي يوم عمل واحد":"بقي "+plural(left,P_DAY)+" للعمل";
  if(needNew>0) w.push([left<=needNew,"زيارات الجدد هذا الأسبوع "+weekNew+"/"+cfg.weeklyNew+(left<=needNew?" · "+lt+": أضف عميلاً جديداً اليوم":"")]);
  const dueCur=[...S.customers.values()].filter(c=>stOf(c.id)==="current"&&!ctx.visitedWeek.has(c.id)&&!inSet.has(c.id)).length;
  if(dueCur>0) w.push([left<=2,plural(dueCur,P_CUR)+" لم يُزاروا هذا الأسبوع"+(left<=2?" · "+lt:"")]);
  if(n<cfg.dailyTarget) w.push([false,"ناقص "+plural(cfg.dailyTarget-n,P_VISIT)+" لإكمال هدف اليوم"]);
  if(n>=5){ const mx=Math.max(cnt.current,cnt.lapsed,cnt.new); if(mx/n>0.7) w.push([true,"الخطة مائلة: "+Math.round(mx/n*100)+"% من نوع واحد"]); }
  const seg=k=>cnt[k]?'<i class="b-'+k+'" style="flex:'+cnt[k]+'"></i>':'';
  return '<div class="balance"><div class="bbar" aria-hidden="true">'+(n?seg("current")+seg("lapsed")+seg("new"):"")+'</div>'
   +'<div class="bleg"><span>حاليون '+cnt.current+'</span><span>سابقون '+cnt.lapsed+'</span><span>جدد '+cnt.new+'</span></div>'
   +(w.length?'<ul class="bwarn">'+w.map(x=>'<li class="'+(x[0]?"warn":"")+'">'+esc(x[1])+'</li>').join("")+'</ul>':'')+'</div>';
}

/* ---------- auth + boot ---------- */
async function boot(){
  if(!window.supabase || SUPABASE_URL.startsWith("__")){
    $("#view").innerHTML='<div class="notice"><b>التطبيق غير مربوط بقاعدة البيانات بعد.</b><br>تحقق من الاتصال بالإنترنت، أو أكمل إعداد Supabase.</div>'; return;
  }
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {auth:{persistSession:true, autoRefreshToken:true, storageKey:"ptv-auth"}});
  sb.auth.onAuthStateChange((ev)=>{ if(ev==="SIGNED_OUT") showLogin(); });
  const {data} = await sb.auth.getSession();
  if(data && data.session) start(data.session); else showLogin();
}

    +'<img class="logo" src="icon-192.png" alt="">'

    +'<div class="field"><label for="lg-email">الإيميل</label><input id="lg-email" class="input" type="email" autocomplete="username" dir="ltr" inputmode="email" required></div>'
    +'<div class="field"><label for="lg-pass">كلمة المرور</label><input id="lg-pass" class="input" type="password" autocomplete="current-password" dir="ltr" required></div>'
    +'<div class="err" id="lg-err"'+(msg?'':' hidden')+'>'+esc(msg||"")+'</div>'
    +'<button class="btn primary" id="lg-btn" type="submit">تسجيل الدخول</button>'
    +'<p class="v-sub">نسيت كلمة المرور؟ اطلب من المدير إعادة تعيينها.</p>'

    e.preventDefault();

async function start(session){
  S.email = String(session.user.email||"").toLowerCase();
  $("#view").innerHTML='<div class="empty"><b>جارٍ تحميل البيانات…</b>العملاء والزيارات والأهداف.</div>';
  const ok = await loadAll();
  if(!ok) return;
  S.me = S.team.get(S.email);
  if(!S.me){
    $("#view").innerHTML='<div class="notice"><b>حسابك غير مضاف إلى فريق المبيعات.</b><br>اطلب من المدير إضافة الإيميل '+esc(S.email)+' إلى الفريق.</div><button class="btn" data-act="logout">تسجيل الخروج</button>';
    return;
  }
  S.isOwner = S.me.role==="manager";
  renderWho(); $(".tabs").hidden=false;
  subscribe();
  S.loaded=true; refresh();
}
async function fetchAllVisits(){
  const out=[]; let from=0;
  for(;;){
    const {data,error} = await sb.from("visits").select("*").order("date",{ascending:false}).order("id").range(from,from+999);
    if(error) throw error;
    out.push(...data); if(data.length<1000) break; from+=1000;
  }
  return out;
}
async function loadAll(){
  try{
    const [c,cfg,team,visits,fac,ord,cost,qts,msgs] = await Promise.all([
      sb.from("customers").select("*"),
      sb.from("config").select("data").eq("id",1).maybeSingle(),
      sb.from("team").select("*"),
      fetchAllVisits(),
      sb.from("facilities").select("*"),
      sb.from("orders").select("*"),
      sb.from("order_costs").select("*"),
      sb.from("quotes").select("*"),
      sb.from("messages").select("*")
    ]);
    S.messages=[]; ((msgs.error?[]:msgs.data)||[]).forEach(putMsg);
    S.quotes = ((qts.error?[]:qts.data)||[]).map(rowToQuote);
    if(c.error) throw c.error; if(team.error) throw team.error;
    if(fac.error||ord.error) throw (fac.error||ord.error);
    S.facilities = new Map(fac.data.map(r=>[r.id,rowToFac(r)]));
    S.orders = ord.data.map(rowToOrder);
    S.costs = new Map(((cost.error?[]:cost.data)||[]).map(r=>[r.order_id,Number(r.margin_pct)]));
    S.customers = new Map(c.data.map(r=>[r.id,rowToCust(r)]));
    S.team = new Map(team.data.map(t=>[String(t.email).toLowerCase(),t]));
    S.cfg = Object.assign({},DEF,(cfg.data&&cfg.data.data)||{});
    S.visits = visits.map(rowToVisit); S.visitById = new Map(S.visits.map(v=>[v.id,v]));
    lastLoad = Date.now();
    return true;
  }catch(e){
    console.error(e);
    if(/JWT|session|token/i.test(String(e.message))) { await sb.auth.signOut(); return false; }
    $("#view").innerHTML='<div class="notice"><b>تعذّر تحميل البيانات.</b><br>تحقق من الاتصال بالإنترنت ثم أعد المحاولة.</div><button class="btn primary" data-act="reload">إعادة المحاولة</button>';
    return false;
  }
}
function subscribe(){
  if(channel) return;
  channel = sb.channel("ptv-live")
    .on("postgres_changes",{event:"*",schema:"public",table:"visits"},p=>{ if(p.eventType==="DELETE") dropVisit(p.old.id); else putVisit(p.new); scheduleRefresh(); })
    .on("postgres_changes",{event:"*",schema:"public",table:"customers"},p=>{ if(p.eventType==="DELETE") S.customers.delete(p.old.id); else putCust(p.new); scheduleRefresh(); })
    .on("postgres_changes",{event:"*",schema:"public",table:"facilities"},p=>{ if(p.eventType==="DELETE") S.facilities.delete(p.old.id); else putFac(p.new); scheduleRefresh(); })
    .on("postgres_changes",{event:"INSERT",schema:"public",table:"messages"},p=>{ putMsg(p.new); scheduleRefresh(); })
    .on("postgres_changes",{event:"*",schema:"public",table:"quotes"},p=>{ if(p.eventType==="DELETE") S.quotes=S.quotes.filter(x=>x.id!==p.old.id); else putQuote(p.new); scheduleRefresh(); })
    .on("postgres_changes",{event:"*",schema:"public",table:"orders"},p=>{ if(p.eventType==="DELETE") dropOrder(p.old.id); else putOrder(p.new); scheduleRefresh(); })
    .on("postgres_changes",{event:"*",schema:"public",table:"order_costs"},p=>{ if(p.eventType==="DELETE") S.costs.delete(p.old.order_id); else S.costs.set(p.new.order_id,Number(p.new.margin_pct)); scheduleRefresh(); })
    .on("postgres_changes",{event:"*",schema:"public",table:"config"},p=>{ if(p.new&&p.new.data){ S.cfg=Object.assign({},DEF,p.new.data); scheduleRefresh(); } })
    .subscribe(status=>{ setLive(status==="SUBSCRIBED"); });
}
function setLive(on){ const l=$("#live"); l.classList.toggle("on",!!on); l.title= on?"متصل لايف":"غير متصل"; }
let rT=null;
function scheduleRefresh(){ if(rT) return; rT=setTimeout(()=>{rT=null;refresh();},120); }

      const q=$("#cust-q"); q.value=S.q; q.addEventListener("input",()=>{S.q=q.value;updateCustomers();}); }

function todayHTML(){
  const day=S.day, t=todayStr(), list=visitsOn(day), cfg=S.cfg;
  const done=list.filter(v=>v.state==="done"), orders=done.filter(v=>v.result==="order").length;
  const ws=weekStart(day);
  const weekNew=S.visits.filter(v=>v.state==="done"&&v.kind==="new"&&v.date>=ws&&v.date<=addDays(ws,6)).length;
  const slotsN=Math.max(cfg.dailyTarget,list.length);
  let slots="";
  const ordered=[...done.filter(v=>v.result==="order"),...done.filter(v=>v.result!=="order"),...list.filter(v=>v.state==="planned"),...list.filter(v=>v.state==="missed")];
  for(let i=0;i<slotsN;i++){const v=ordered[i];slots+='<i class="slot '+(!v?"":v.state==="done"?(v.result==="order"?"order":"done"):v.state)+'"></i>';}
  const isFri=dow(day)===5;
  const rel = day===t?"اليوم":day===addDays(t,1)?"غداً":day===addDays(t,-1)?"أمس":"";
  let h='<section class="dayhead">'
   +'<div class="daynav"><button class="iconbtn" data-act="day-prev" aria-label="اليوم السابق">'+ICON.prev+'</button>'
   +'<div class="d"><b>'+esc(dLong(day))+'</b><span>'+(rel?rel:'<button class="btn sm ghost" data-act="day-today">العودة لليوم</button>')+'</span></div>'
   +'<button class="iconbtn" data-act="day-next" aria-label="اليوم التالي">'+ICON.next+'</button></div>'
   +'<div class="rings">'+ring(done.length,cfg.dailyTarget,"var(--accent)","زيارات")+ring(quoteStats(day).day.n,cfg.dailyQuotes,"var(--orange)","تسعير")+ring(quoteStats(day).day.w,cfg.dailyWins,"var(--good)","إغلاق")+'</div>'
   +achLine(day)
   +(!list.length?'':balanceHTML(list.filter(v=>v.state!=="missed").map(v=>v.customerId),day))
   +'<button class="btn primary" data-act="open-suggest">'+ICON.spark.replace("<svg",'<svg width="18" height="18"')+(list.length?"أكمل الخطة تلقائياً":"اقترح خطة اليوم")+'</button>'
   +'<div class="row grow"><button class="btn" data-act="open-planner">'+(list.length?"تعديل الخطة":"اختيار يدوي")+'</button><button class="btn" data-act="open-log">زيارة غير مخططة</button></div>'
   +'</section>';
  if(day===t){
    const co=carryItems(day);
    if(co.length) h+='<section class="notice carry"><div><b>لديك '+plural(co.length,P_VISIT)+' مخططة لم تُنفَّذ في أيام سابقة</b><br>'+esc(co.slice(0,4).map(x=>cname(x.c)).join("، ")+(co.length>4?" وغيرهم":""))+'</div>'
      +'<div class="row grow"><button class="btn sm primary" data-act="carry-move">رحّلها لليوم</button><button class="btn sm" data-act="carry-drop">تجاهلها</button></div></section>';
  }
  if(day===t && dow(day)!==5) h+=prioHTML(day);
  if(isFri && !list.length) h+='<div class="empty"><b>الجمعة يوم راحة</b>لا توجد زيارات مخططة.</div>';
  else if(!list.length) h+='<div class="empty"><b>لا توجد زيارات مخططة لهذا اليوم</b>ابدأ يومك بالتخطيط: اختر '+cfg.dailyTarget+' عملاء من القاعدة، بحيث تبدأ بالحاليين المستحقين للزيارة، ثم السابقين، ثم الجدد.</div>';
  else {
    const p=list.filter(v=>v.state==="planned"), d=list.filter(v=>v.state!=="planned");
    if(p.length) h+='<h2 class="sec">بانتظار التنفيذ <small>'+p.length+' زيارة</small></h2><div class="list">'+p.map(v=>visitCard(v)).join("")+'</div>';

  if(dow(day)!==5||day===t) h+=quotesHTML(day);

/* the "orders of the day": at most three things that must not be missed, each with the reason */
function dailyPriorities(day){
  const ctx=planCtx(day), best=new Map();
  for(const c of S.customers.values()){
    const dv=visitFor(c.id,day); if(dv&&dv.state==="done") continue;
    const fm=fmOf(c), r=scoreCustomer(c,day,ctx), d=S.der.get(c.id)||{};
    let u=0, why="";
    if(r.kind==="carry"){ u=100; why="زيارة مخططة سابقاً لم تُنفَّذ"; }
    else if(r.kind==="follow"){ u=95; why=r.reason; }
    else if(fm&&fm.fading&&fm.tier!=="C"){ u=90+(fm.tier==="A"?8:0); why=fm.gap&&fm.dso!=null?"كان يطلب كل "+fm.gap+" يوماً وقد مرّ "+fm.dso+" يوماً":"اهتمامه يتراجع، تحرّك قبل أن تفقده"; }
    else if(stageOf(c.id)==="new2"){ u=80; why="طلبيتان من ثلاث: ثبّته بالثالثة ليصبح حالياً"; }
    else if(d.status==="lapsed"&&fm&&fm.tier!=="C"){ u=70; why="عميل سابق فئة "+fm.tier+(d.lastOrder?" · آخر طلبية قبل "+diff(d.lastOrder,day)+" يوماً":""); }
    else continue;
    const k=facKey(c), o=best.get(k); if(!o||u>o.u) best.set(k,{u,why,c,planned:!!dv});
  }
  for(const q of S.quotes){
    if(q.status!=="open") continue; const age=diff(q.date,day); if(age<2) continue;
    const c=S.customers.get(q.customerId); if(!c) continue;
    const k=facKey(c), o=best.get(k), dv=visitFor(c.id,day), u=92+Math.min(age,6);
    if(!o||u>o.u) best.set(k,{u,why:"عرض سعر مفتوح منذ "+plural(age,P_DAY)+": "+shorten(q.item,30)+" · تابعه قبل أن يشتري من غيرك",c,planned:!!dv});
  }
  return [...best.values()].sort((a,b)=>b.u-a.u).slice(0,3);
}
function prioHTML(day){
  const items=dailyPriorities(day); if(!items.length) return "";
  return '<section class="card"><h3>أولويات اليوم <small>لا تفوّتها</small></h3><div class="prio">'
   +items.map(x=>'<div class="pi"><div class="pm"><b>'+esc(cname(x.c))+' '+tierChip(x.c)+'</b><span class="pw">'+esc(facOf(x.c).name)+'</span><span class="pw">'+esc(x.why)+'</span></div>'
     +(x.planned?'<span class="chip order">✓ في الخطة</span>':'<button class="btn sm primary" data-act="prio-add" data-id="'+esc(x.c.id)+'">أضف للخطة</button>')+'</div>').join("")
   +'</div></section>';
}

function lastNoteFor(cid, beforeDate){
  return S.visits.filter(x=>x.customerId===cid&&x.state==="done"&&x.notes&&x.date<=beforeDate).sort((a,b)=>a.date<b.date?1:-1)[0]||null;
}
function checkN(v){ const k=Object.keys(v.checks||{}); return {n:k.filter(x=>v.checks[x]).length,t:k.length}; }
function otherNames(v){ return (v.people||[]).map(p=>{const c=S.customers.get(p.id); return c?cname(c):""}).filter(Boolean); }
function visitCard(v,o){
  o=o||{};
  const c=S.customers.get(v.customerId)||{};
  const phone=c.phone||"";
  let h='<article class="visit st-'+esc(v.state)+'">'
   +'<div class="v-top"><div style="min-width:0"><div class="v-name">'+(o.noLink?esc(cname(c)):'<button data-act="cust" data-id="'+esc(v.customerId)+'">'+esc(cname(c))+'</button>')+'</div>'
   +'<div class="v-sub">'+esc([facOf(c).name,c.title].filter(Boolean).join(" · "))+'</div>'
   +(otherNames(v).length?'<div class="v-sub">ومعه: '+esc(otherNames(v).join("، "))+'</div>':'')
   +(o.showBy?'<div class="v-sub">سجّلها: '+esc(teamName(v.doneBy||v.by))+'</div>':'')+'</div>'
   +'<div class="v-time">'+(o.showDate?esc(dShort(v.date))+" ":"")+(v.time?esc(v.time):"")+'</div></div>'
   +'<div class="v-meta">'+chipFor(v.customerId)+tierChip(c)+(v.state==="planned"?intChip(c):"")+'<span>الهدف: '+esc(v.goal||PURPOSE[v.purpose]||"")+'</span>'
   +(v.state==="done"&&v.result?'<span class="chip '+esc(v.result)+'">'+esc(RESULT[v.result])+'</span>':"")
   +(v.state==="done"&&v.goalMet?'<span class="chip muted">الهدف: '+esc(GOAL_MET[v.goalMet]||"")+'</span>':"")
   +(v.state==="done"&&v.channel?'<span class="chip muted">'+esc(CHANNEL[v.channel])+'</span>':"")
   +(v.state==="missed"?'<span class="chip missed">لم تتم</span>':"")
   +(v.state==="done"&&checkN(v).t?'<span class="chip muted">الجودة '+checkN(v).n+'/'+checkN(v).t+'</span>':"")+'</div>';
  if(v.state==="planned"){
    const last=lastNoteFor(v.customerId,v.date);

  } else if(v.notes){
    h+='<div class="v-note"><span class="k">ملاحظات الزيارة</span>'+esc(v.notes)+(v.next&&v.next.text?"\nالخطوة القادمة: "+esc(v.next.text)+(v.next.date?" ("+esc(dShort(v.next.date))+")":""):"")+'</div>';

  if(v.state==="planned") h+='<button class="btn sm" data-act="guide" data-id="'+esc(v.id)+'">المرشد</button>';
  h+='<button class="btn sm '+(v.state==="planned"?"primary":"")+'" data-act="result" data-id="'+esc(v.id)+'">'+(v.state==="planned"?"سجّل النتيجة":"تعديل")+'</button>';

  h+='</div></article>';
  return h;
}

function custShellHTML(){
  return '<div class="searchbar"><input id="cust-q" class="input" type="search" placeholder="ابحث بالاسم أو الجهة أو المنطقة أو الرقم" aria-label="بحث العملاء">'
   +'<button class="btn primary" data-act="new-cust" aria-label="إضافة عميل">'+ICON.plus.replace("<svg",'<svg width="20" height="20"')+'</button></div>'
   +'<div class="filters" id="cust-f"></div><button class="btn sm ghost" data-act="open-quality">جودة البيانات: ما الناقص؟</button><div class="list" id="cust-list"></div>';
}
function matchQ(c,q){ if(!q) return true; q=q.trim(); return [c.person,c.org,facOf(c).name,c.title,c.area,c.phone,c.type].some(x=>x&&String(x).includes(q)); }
function updateCustomers(){
  const all=[...S.customers.values()];
  const counts={all:all.length,current:0,lapsed:0,new:0,due:0};
  const ws=weekStart(todayStr());
  for(const c of all){const s=stOf(c.id);counts[s]++; if(s==="current"&&!(S.lastVisit.get(c.id)>=ws)) counts.due++;}
  counts.A=all.filter(c=>(fmOf(c)||{}).tier==="A").length; counts.fade=all.filter(c=>(fmOf(c)||{}).fading&&(fmOf(c)||{}).tier!=="C").length;
  const F=[["all","الكل"],["current","حالي"],["due","حاليون لم يُزاروا هذا الأسبوع"],["lapsed","سابق"],["new","جديد"],["A","فئة A"],["fade","اهتمامه يبرد"]];
  $("#cust-f").innerHTML=F.map(f=>'<button data-act="filter" data-f="'+f[0]+'" aria-pressed="'+(S.filter===f[0])+'">'+f[1]+' <span class="num">'+counts[f[0]]+'</span></button>').join("");
  let rows=all.filter(c=>matchQ(c,S.q));
  if(S.filter==="due") rows=rows.filter(c=>stOf(c.id)==="current"&&!(S.lastVisit.get(c.id)>=ws));
  else if(S.filter==="A") rows=rows.filter(c=>(fmOf(c)||{}).tier==="A");
  else if(S.filter==="fade") rows=rows.filter(c=>(fmOf(c)||{}).fading&&(fmOf(c)||{}).tier!=="C");
  else if(S.filter!=="all") rows=rows.filter(c=>stOf(c.id)===S.filter);
  const today=todayStr(), ctx=planCtx(today), pri=new Map();
  for(const c of rows){ const r=scoreCustomer(c,today,ctx); if(visitFor(c.id,today)){ r.score-=1000; r.reason="✓ في خطة اليوم"; } pri.set(c.id,r); }
  rows.sort((a,b)=>pri.get(b.id).score-pri.get(a.id).score);
  const el=$("#cust-list");
  if(!all.length){ el.innerHTML='<div class="empty"><b>قاعدة العملاء فارغة</b>أضف أول عميل بزر + في الأعلى.</div>'; return; }
  if(!rows.length){ el.innerHTML='<div class="empty"><b>لا توجد نتائج</b>جرّب كلمة بحث أخرى أو فلتراً مختلفاً.</div>'; return; }
  el.innerHTML=rows.map(c=>{
    const s=stOf(c.id), lv=S.lastVisit.get(c.id), d=S.der.get(c.id);
    const overdue = s==="current" && (!lv || diff(lv,todayStr())>=7);
    return '<button class="cust" data-act="cust" data-id="'+esc(c.id)+'"><span class="avatar '+s+'">'+esc(initials(c))+'</span>'
     +'<span class="c-main"><span class="c-name">'+esc(cname(c))+'</span><span class="c-sub">'+esc([facOf(c).name,c.title].filter(Boolean).join(" · "))+(custIssues(c).length?' ⚠':'')+'</span><span class="c-why">'+esc(pri.get(c.id).reason)+'</span></span>'
     +'<span class="c-side"><span>'+tierChip(c)+' '+chipFor(c.id)+'</span>'+intChip(c)+'<span class="'+(overdue?"due":"")+'">'+esc(ago(lv))+'</span>'+(d&&d.count?'<span>'+d.count+' طلبية</span>':'')+'</span></button>';
  }).join("");
}

/* ---------- DASHBOARD ---------- */
function kpi(label, val, target, opt){
  opt=opt||{};
  const p = target? pct(val,target):0;
  const cls = target? (val>=target?"ok":(opt.pace!=null&&val<target*opt.pace*0.8?"low":"")) : "";
  return '<div class="kpi"><div class="kl"><span>'+label+'</span><b class="num">'+(opt.pct?val+'%':val+(target?' <small>/ '+target+'</small>':''))+'</b></div>'
   +(target?'<div class="bar"><i class="'+cls+'" style="width:'+p+'%"></i>'+(opt.pace!=null&&opt.pace<1?'<em style="inset-inline-start:calc('+Math.round(opt.pace*100)+'% - 1px)" title="الوتيرة المطلوبة حتى اليوم"></em>':'')+'</div>':'')
   +(opt.hint?'<div class="hint">'+opt.hint+'</div>':'')+'</div>';
}

/* quotes: day / week / month against the targets (26 working days a month, Friday off) */
function dashQuotes(t){
  const cfg=S.cfg, st=quoteStats(t), mk=monthKey(t), ms=mk+"-01";
  let el=0; for(let d=ms;d<=t;d=addDays(d,1)) if(dow(d)!==5) el++;
  const pace=Math.min(1,el/cfg.workDaysMonth), mq=cfg.dailyQuotes*cfg.workDaysMonth, mw=cfg.dailyWins*cfg.workDaysMonth;
  const rate=st.month.n?Math.round(st.month.w/st.month.n*100):0, tr=Math.round(cfg.dailyWins/cfg.dailyQuotes*100);
  const lost=new Map(); S.quotes.filter(q=>q.status==="lost"&&q.date>=addDays(t,-60)).forEach(q=>lost.set(q.lostReason||"أخرى",(lost.get(q.lostReason||"أخرى")||0)+1));
  return '<section class="card"><h3>التسعير والإغلاق <small>'+cfg.dailyQuotes+' طلبات يومياً، وإغلاق '+cfg.dailyWins+'</small></h3>'
   +kpi("طلبات التسعير اليوم",st.day.n,cfg.dailyQuotes)+kpi("إغلاقات اليوم",st.day.w,cfg.dailyWins)
   +kpi("طلبات التسعير هذا الأسبوع",st.week.n,cfg.dailyQuotes*6)+kpi("إغلاقات هذا الأسبوع",st.week.w,cfg.dailyWins*6)
   +kpi("طلبات التسعير هذا الشهر",st.month.n,mq,{pace,hint:cfg.workDaysMonth+" يوم عمل في الشهر"})+kpi("إغلاقات هذا الشهر",st.month.w,mw,{pace})
   +kpi("نسبة الإغلاق هذا الشهر",rate,tr,{pct:1,hint:"الهدف: إغلاق "+cfg.dailyWins+" من كل "+cfg.dailyQuotes+" طلبات"})
   +(lost.size?'<div class="hint v-sub">أسباب عدم الإغلاق: '+[...lost].sort((a,b)=>b[1]-a[1]).map(x=>esc(x[0])+" ("+x[1]+")").join("، ")+'</div>':'')
   +'</section>';
}
/* tiers, fading accounts, stop reasons and incomplete orders */
function dashAccounts(t){
  const ms=[...S.facM.values()], cnt={A:0,B:0,C:0};
  ms.forEach(m=>cnt[m.tier]++);
  const fade=ms.filter(m=>m.fading&&m.tier!=="C").sort((a,b)=>(a.tier===b.tier?b.comp-a.comp:a.tier<b.tier?-1:1)).slice(0,6);
  let h='<section class="card"><h3>فئات العملاء <small>'+ms.length+' منشأة</small></h3><div class="tiles">'
   +'<div class="tile"><b>'+cnt.A+'</b><span>فئة A</span></div><div class="tile"><b>'+cnt.B+'</b><span>فئة B</span></div><div class="tile"><b>'+cnt.C+'</b><span>فئة C</span></div>'
   +'<div class="tile"><b>'+ms.filter(m=>m.fading&&m.tier!=="C").length+'</b><span>تبرد (A/B)</span></div></div>';
  if(fade.length) h+='<h2 class="sec">أولوية المتابعة: يبرد اهتمامها</h2><div class="prio">'+fade.map(m=>'<div class="pi"><div class="pm"><b>'+esc(m.fac.name||"منشأة")+' <span class="chip tier tier-'+m.tier+'">'+m.tier+'</span></b><span class="pw">'
    +esc(m.gap&&m.dso!=null?"كانت تطلب كل "+m.gap+" يوماً وقد مرّ "+m.dso+" يوماً":(LEVEL[m.level]||""))+'</span></div><button class="btn sm" data-act="cust" data-id="'+esc(m.people[0].id)+'">فتح</button></div>').join("")+'</div>';
  h+='</section>';
  const rs=new Map(); const since=addDays(t,-60);
  S.visits.filter(v=>v.state==="done"&&v.reason&&v.date>=since).forEach(v=>rs.set(v.reason,(rs.get(v.reason)||0)+1));
  if(rs.size){ const mx=Math.max(...rs.values());
    h+='<section class="card"><h3>أسباب عدم الاهتمام <small>آخر 60 يوماً</small></h3>'+[...rs].sort((a,b)=>b[1]-a[1]).map(([k,n])=>'<div class="kpi"><div class="kl"><span>'+esc(k)+'</span><b class="num">'+n+'</b></div><div class="bar"><i style="width:'+Math.round(n/mx*100)+'%"></i></div></div>').join("")+'</section>'; }
  const inc=incompleteOrders().sort((a,b)=>a.date<b.date?1:-1).slice(0,8);
  const nm=S.isOwner?S.orders.filter(o=>o.status!=="cancelled"&&!S.costs.has(o.id)).length:0;
  if(inc.length||nm){
    h+='<section class="card"><h3>طلبيات تحتاج استكمالاً'+(nm?' <small>'+nm+' بلا هامش ربح</small>':'')+'</h3>'
     +(inc.length?'<div class="list">'+inc.map(o=>orderRow(o)).join("")+'</div>':'<div class="v-sub">كل الطلبيات لها رقم وقيمة.</div>')
     +(nm?'<button class="btn" data-act="margins">أدخل هامش الربح للطلبيات</button>':'')+'</section>';
  }
  return h;
}
function orderRow(o){
  const c=S.customers.get(o.customerId);
  return '<div class="ord"><span>'+esc(dShort(o.date))+' · '+esc(c?cname(c):"—")+'</span><span class="num">'+(o.orderNo?esc(o.orderNo):'<span class="due">بلا رقم</span>')+' · '+(o.value>0?o.value.toLocaleString("en-US")+' ر.س':'<span class="due">بلا قيمة</span>')+'</span><button class="btn sm" data-act="edit-order" data-id="'+esc(o.id)+'">تعديل</button></div>';
}
function chart14(t){
  const days=[];for(let i=13;i>=0;i--) days.push(addDays(t,-i));
  const cnt=days.map(d=>S.visits.filter(v=>v.state==="done"&&v.date===d).length);
  const ord=days.map(d=>S.visits.filter(v=>v.state==="done"&&v.result==="order"&&v.date===d).length);
  const T=S.cfg.dailyTarget, max=Math.max(T,...cnt)+1;
  const W=340,H=160,L=8,R=8,top=14,bot=26, ih=H-top-bot, bw=(W-L-R)/14;
  const y=v=>top+ih-(v/max)*ih;
  let s='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="عدد الزيارات اليومية لآخر 14 يوماً">';
  s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+(top+ih)+'" y2="'+(top+ih)+'" stroke="var(--line)" stroke-width="1"/>';
  days.forEach((d,i)=>{
    const x=W-R-(i+1)*bw+3, w=bw-6;  /* newest on the left (RTL time axis) */
    const fri=dow(d)===5;
    if(cnt[i]){ s+='<rect x="'+x.toFixed(1)+'" y="'+y(cnt[i]).toFixed(1)+'" width="'+w.toFixed(1)+'" height="'+(top+ih-y(cnt[i])).toFixed(1)+'" rx="3" fill="var(--accent)" opacity="'+(d===t?1:.75)+'"/>';
      if(ord[i]) s+='<rect x="'+x.toFixed(1)+'" y="'+y(ord[i]).toFixed(1)+'" width="'+w.toFixed(1)+'" height="'+(top+ih-y(ord[i])).toFixed(1)+'" rx="3" fill="var(--good)"/>';
      s+='<text x="'+(x+w/2).toFixed(1)+'" y="'+(y(cnt[i])-4).toFixed(1)+'" text-anchor="middle">'+cnt[i]+'</text>'; }
    s+='<text x="'+(x+w/2).toFixed(1)+'" y="'+(H-10)+'" text-anchor="middle"'+(fri?' opacity=".5"':'')+(d===t?' font-weight="700"':'')+'>'+Number(d.slice(8))+'</text>';
  });
  s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y(T).toFixed(1)+'" y2="'+y(T).toFixed(1)+'" stroke="var(--ink-3)" stroke-dasharray="4 4" stroke-width="1"/>';
  s+='<text x="'+(W-R)+'" y="'+(y(T)-4).toFixed(1)+'" text-anchor="end">الهدف '+T+'</text></svg>';
  s+='<div class="legend"><span><i style="background:var(--accent)"></i>زيارات منجزة</span><span><i style="background:var(--good)"></i>منها طلبيات</span><span>الأرقام بالأسفل = يوم الشهر، والأحدث على اليسار</span></div>';
  return s;
}

/* ---------- SHEETS ---------- */
function openSheet(o){
  closeSheet();
  const root=$("#sheet-root");
  root.innerHTML='<div class="scrim" data-scrim><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-title">'
   +'<div class="sheet-h"><div><h2 id="sh-title">'+o.title+'</h2>'+(o.sub?'<p>'+o.sub+'</p>':'')+'</div><button class="iconbtn" data-act="close-sheet" aria-label="إغلاق">'+ICON.close+'</button></div>'
   +'<div class="sheet-b" id="sh-body">'+o.body+'</div>'+(o.foot?'<div class="sheet-f">'+o.foot+'</div>':'')+'</div></div>';
  root.querySelector("[data-scrim]").addEventListener("click",e=>{ if(e.target.hasAttribute("data-scrim")) closeSheet(); });
  S.sheet={onUpdate:o.onUpdate||null};
  document.body.style.overflow="hidden";
  if(o.mount) o.mount(root);
}
function closeSheet(){ const r=$("#sheet-root"); if(r) r.innerHTML=""; S.sheet=null; document.body.style.overflow=""; }
document.addEventListener("keydown",e=>{ if(e.key==="Escape"&&S.sheet) closeSheet(); });

/* planner / quick log picker */
function openPlanner(mode){
  const day=S.day;
  const areas=[...new Set([...S.customers.values()].map(c=>c.area).filter(Boolean))];
  let area="";
  openSheet({
    title: mode==="plan" ? "خطة "+esc(dLong(day)) : "تسجيل زيارة غير مخططة",
    sub: mode==="plan" ? '<span id="pl-count"></span>' : "اختر العميل الذي زرته أو اتصلت به",
    body:(mode==="plan"?'<div id="pl-balance"></div>':'')+'<input id="pl-q" class="input" type="search" placeholder="بحث بالاسم أو الجهة" aria-label="بحث">'
      +(areas.length?'<div class="filters" id="pl-areas">'+['<button data-area="" aria-pressed="true">كل المناطق</button>'].concat(areas.map(a=>'<button data-area="'+esc(a)+'" aria-pressed="false">'+esc(a)+'</button>')).join("")+'</div>':'')
      +'<div id="pl-list"></div>',
    foot: mode==="plan" ? '<button class="btn primary" data-act="close-sheet">تم</button>' : '',
    mount(root){
      $("#pl-q",root).addEventListener("input",draw);
      const ar=$("#pl-areas",root);
      if(ar) ar.addEventListener("click",e=>{const b=e.target.closest("[data-area]");if(!b)return;area=b.dataset.area;ar.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));draw();});
      $("#pl-list",root).addEventListener("click",async e=>{
        const b=e.target.closest("[data-pick]"); if(!b||b.disabled) return;
        const cid=b.dataset.pick;
        if(mode==="log"){
          const ex=visitFor(cid,day);
          if(ex){ openResult(ex.id); return; }
          b.disabled=true; const id=await createVisit(cid,day,{unplanned:true}); if(id) openResult(id,{fresh:true}); else b.disabled=false; return;
        }
        const ex=visitFor(cid,day);
        b.disabled=true;
        if(ex){ if(ex.state==="planned") await removeVisit(ex.id); else toast("هذه الزيارة مسجّلة مسبقاً لهذا اليوم"); }
        else await createVisit(cid,day);
        b.disabled=false;
      });
      draw();
    },
    onUpdate(){ draw(); }
  });
  function draw(){
    const list=$("#pl-list"); if(!list) return;
    const qv=($("#pl-q")||{}).value||"";
    const ws=weekStart(day), we=addDays(ws,6), cfg=S.cfg;
    if(mode==="plan"){ const pc=$("#pl-count"); if(pc) pc.textContent="في الخطة "+visitsOn(day).length+" من "+cfg.dailyTarget+" زيارات · زيارات الجدد هذا الأسبوع "+S.visits.filter(v=>v.kind==="new"&&v.date>=ws&&v.date<=we&&v.state!=="missed").length+"/"+cfg.weeklyNew; }
    const all=[...S.customers.values()].filter(c=>matchQ(c,qv)&&(!area||c.area===area));
    if(mode==="plan"){ const pb=$("#pl-balance"); if(pb) pb.innerHTML=balanceHTML(visitsOn(day).filter(v=>v.state!=="missed").map(v=>v.customerId),day); }
    const ctx=planCtx(day), sc=new Map(all.map(c=>[c.id,scoreCustomer(c,day,ctx)]));
    const kindOf=c=>sc.get(c.id).kind, byScore=(a,b)=>sc.get(b.id).score-sc.get(a.id).score;
    const groups=[
      ["مرحّلة ومتابعات مستحقة", all.filter(c=>kindOf(c)==="carry"||kindOf(c)==="follow")],
      ["حاليون مستحقون للزيارة هذا الأسبوع", all.filter(c=>kindOf(c)==="current")],
      ["سابقون للاسترجاع", all.filter(c=>kindOf(c)==="lapsed")],
      ["جدد", all.filter(c=>kindOf(c)==="new")],
      ["حاليون تمت زيارتهم هذا الأسبوع", all.filter(c=>kindOf(c)==="current-done")]
    ];
    let h="";
    for(const [label,rows] of groups){
      if(!rows.length) continue;
      rows.sort(byScore);
      h+='<div class="grp-h">'+label+' · '+rows.length+'</div>';
      h+=rows.map(c=>{
        const ex=visitFor(c.id,day);
        const on=!!ex, lock=ex&&ex.state!=="planned";
        const cls= lock?"tog lock": on?"tog on":"tog";
        const lbl = mode==="log" ? "سجّل زيارة "+cname(c) : (on?"إزالة "+cname(c)+" من الخطة":"إضافة "+cname(c)+" للخطة");
        return '<div class="pick"><div class="p-main"><div class="p-name">'+esc(cname(c))+' '+chipFor(c.id)+'</div><div class="p-sub">'+esc([facOf(c).name,c.area&&!String(facOf(c).name||"").includes(c.area)?c.area:""].filter(Boolean).join(" · "))+' '+tierChip(c)+intChip(c)+'</div><div class="why">'+esc(sc.get(c.id).reason)+'</div></div>'
          +'<button class="'+(mode==="log"?"tog":cls)+'" data-pick="'+esc(c.id)+'" aria-label="'+esc(lbl)+'"'+(mode==="plan"?' aria-pressed="'+on+'"':'')+'>'+(mode==="log"?ICON.next:(on?ICON.check:ICON.plus))+'</button></div>';
      }).join("");
    }
    list.innerHTML = h || '<div class="empty"><b>لا يوجد عملاء مطابقون</b>جرّب بحثاً آخر.</div>';
  }
}

/* suggested plan: everything pre-selected, the salesman unticks what he doesn't want, then confirms */
function openSuggest(){
  const day=S.day;
  if(dow(day)===5){ toast("الجمعة يوم راحة"); return; }
  const areas=[...new Set([...S.customers.values()].map(c=>c.area).filter(Boolean))];
  let areaPref="", res=null, sel=new Set();
  const run=()=>{ res=suggestPlan(day,areaPref); sel=new Set(res.picks.map(p=>p.id)); };
  run();
  openSheet({
    title:"خطة مقترحة لـ"+esc(dLong(day)),
    sub:'<span id="sg-sub"></span>',
    body:'<div id="sg-balance"></div>'
      +(areas.length?'<div class="field"><span class="lab">منطقة اليوم</span><div class="filters" id="sg-areas">'+['<button data-area="" aria-pressed="true">تلقائي</button>'].concat(areas.map(a=>'<button data-area="'+esc(a)+'" aria-pressed="false">'+esc(a)+'</button>')).join("")+'</div></div>':'')
      +'<div id="sg-list"></div>',
    foot:'<button class="btn primary" id="sg-ok"></button><button class="btn" data-act="close-sheet">إلغاء</button>',
    mount(root){
      const ar=$("#sg-areas",root);
      if(ar) ar.addEventListener("click",e=>{const b=e.target.closest("[data-area]");if(!b)return;areaPref=b.dataset.area;ar.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));run();draw();});
      $("#sg-list",root).addEventListener("click",e=>{const b=e.target.closest("[data-sg]");if(!b)return;const id=b.dataset.sg;if(sel.has(id)) sel.delete(id); else sel.add(id);draw();});
      $("#sg-ok",root).addEventListener("click",async()=>{
        const picks=res.picks.filter(p=>sel.has(p.id)); if(!picks.length) return;
        $("#sg-ok").disabled=true;
        const n=await addPlanned(day,picks);
        if(n){ toast("أُضيفت "+n+" زيارات للخطة. يمكنك تعديلها من «تعديل الخطة»"); closeSheet(); } else $("#sg-ok").disabled=false;
      });
      draw();
    },
    onUpdate(){}
  });
  function draw(){
    const list=$("#sg-list"); if(!list) return;
    const picks=res.picks, n=sel.size;
    const existing=visitsOn(day).filter(v=>v.state!=="missed").map(v=>v.customerId);
    $("#sg-sub").textContent= res.slots? "في الخطة "+res.inPlan+" · مقترح "+picks.length+(res.area?" · المنطقة الرئيسية: "+res.area:"") : "خطة اليوم مكتملة ("+res.inPlan+" من "+S.cfg.dailyTarget+")";
    $("#sg-balance").innerHTML=balanceHTML(existing.concat([...sel]),day);
    const ok=$("#sg-ok"); ok.textContent= n? "أضف "+n+" زيارات للخطة":"لا توجد زيارات"; ok.disabled=!n;
    if(!picks.length){ list.innerHTML='<div class="empty"><b>'+(res.slots?"لا يوجد عملاء متاحون للاقتراح":"لا مقاعد فارغة")+'</b>'+(res.slots?"كل العملاء في خطة اليوم بالفعل.":"زد هدف اليوم من إعدادات الخطة أو أزل زيارة أولاً.")+'</div>'; return; }
    let last=null, h="";
    for(const p of picks){
      const a=p.area||"بدون منطقة";
      if(a!==last){ h+='<div class="grp-h">'+esc(a)+'</div>'; last=a; }
      const on=sel.has(p.id), c=p.c;
      h+='<div class="pick"><div class="p-main"><div class="p-name">'+esc(cname(c))+' '+chipFor(p.id)+'</div><div class="p-sub">'+esc(facOf(c).name||"")+' '+tierChip(c)+'</div><div class="why">'+esc(p.reason)+'</div></div>'
        +'<button class="tog'+(on?" on":"")+'" data-sg="'+esc(p.id)+'" aria-pressed="'+on+'" aria-label="'+esc((on?"إزالة ":"إضافة ")+cname(c))+'">'+(on?ICON.check:ICON.plus)+'</button></div>';
    }
    list.innerHTML=h;
  }
}

/* result sheet: adaptive to the customer's stage, with mandatory fields that cannot be skipped */
function num(s){ const n=Number(String(s||"").replace(/[٠-٩]/g,x=>"٠١٢٣٤٥٦٧٨٩".indexOf(x)).replace(/[,\s٬]/g,"")); return isFinite(n)?n:0; }
function openResult(id, opt){
  const v=S.visitById.get(id); if(!v){ toast("الزيارة غير موجودة"); return; }
  const c=S.customers.get(v.customerId)||{};
  const stg=STAGES[stageOf(v.customerId)];
  const others=(S.facPeople.get(facKey(c))||[]).filter(x=>x.id!==c.id);
  const prevP=new Map((v.people||[]).map(p=>[p.id,p]));
  const myOrder=S.orders.find(o=>o.visitId===v.id&&o.customerId===v.customerId);
  const r=(name,val,label,checked)=>'<input type="radio" name="'+name+'" id="'+name+'-'+val+'" value="'+val+'"'+(checked?" checked":"")+'><label for="'+name+'-'+val+'">'+label+'</label>';
  const ch=v.channel||"visit";
  const goals=stg.goals.concat(v.goal&&!stg.goals.includes(v.goal)?[v.goal]:[]);

async function saveResult(v,stg,others){
  const err=$("#rs-err"), bad=[], miss=[];
  document.querySelectorAll("#sh-body .bad").forEach(x=>x.classList.remove("bad"));
  const fail=(msg,el)=>{ miss.push(msg); if(el) bad.push(el); };
  const res=(document.querySelector('input[name="rs-res"]:checked')||{}).value;
  const channel=(document.querySelector('input[name="rs-ch"]:checked')||{}).value||"visit";
  const notes=$("#rs-notes").value.trim(), nt=$("#rs-next").value.trim(), nd=$("#rs-nextd").value;
  const gm=(document.querySelector('input[name="rs-gm"]:checked')||{}).value||"";
  const reason=$("#rs-reason").value;
  const entries=[], people=[];
  if(!res) fail("اختر نتيجة الزيارة",$("#f-res"));
  else if(res==="absent"){
    if(!nd||nd<=v.date) fail("حدد موعد زيارة قادمة لأن العميل لم يتواجد",$("#rs-nextd"));
  } else {
    if(notes.length<25) fail("اكتب ملاحظة مفصلة (25 حرفاً على الأقل): ماذا يحتاج العميل وماذا اتفقتما",$("#rs-notes"));
    if(!gm) fail("أجب: هل تحقق هدف الزيارة؟",$("#f-gm"));
    if(res==="notnow"&&!reason) fail("اختر سبب عدم الاهتمام",$("#rs-reason"));
    if(nt.length<5) fail("اكتب الخطوة القادمة",$("#rs-next"));
    if(!nd||nd<=v.date) fail("حدد تاريخ الخطوة القادمة (بعد تاريخ الزيارة)",$("#rs-nextd"));
    if(res==="order"){
      const val=num($("#rs-val").value), no=$("#rs-ono").value.trim(), nono=$("#rs-nono").checked;
      if(!(val>0)) fail("اكتب قيمة الطلبية بالريال",$("#rs-val"));
      if(!no&&!nono) fail("اكتب رقم الطلبية أو علّم «لم أحصل على الرقم بعد»",$("#rs-ono"));
      entries.push({cid:v.customerId,orderNo:no,value:val,margin:S.isOwner&&$("#rs-mar")&&$("#rs-mar").value.trim()!==""?num($("#rs-mar").value):null});
    }
    others.forEach((o,i)=>{
      if(!$("#pp-on-"+i).checked) return;
      const rr=$("#pp-res-"+i).value, p={id:o.id,result:rr};
      if(rr==="order"){
        const val=num($("#pp-val-"+i).value); if(!(val>0)) fail("اكتب قيمة طلبية "+cname(o),$("#pp-val-"+i));
        p.orderNo=$("#pp-no-"+i).value.trim(); p.value=val; entries.push({cid:o.id,orderNo:p.orderNo,value:val,margin:null});
      }
      people.push(p);
    });
  }
  if(miss.length){
    bad.forEach(e=>e.classList.add("bad"));
    err.innerHTML='<b>أكمل ما يلي قبل الحفظ:</b><ul style="margin:4px 0 0;padding-inline-start:18px">'+miss.map(m=>'<li>'+esc(m)+'</li>').join("")+'</ul>';
    err.hidden=false; if(bad[0]&&bad[0].scrollIntoView) bad[0].scrollIntoView({block:"center",behavior:"smooth"}); return;
  }
  err.hidden=true;
  const abs=res==="absent", checks={};
  if(!abs) stg.checks.forEach(k=>checks[k[0]]=$("#rs-ck-"+k[0]).checked);
  const btn=$("#rs-save"); btn.disabled=true;
  const ok=await updateVisit(v.id,{state:"done",result:res,channel,notes,next_text:nt,next_date:nd||null,checks,goal:abs?v.goal:$("#rs-goal").value,goal_met:abs?"":gm,reason:res==="notnow"?reason:"",people,time:$("#rs-time").value,done_at:new Date().toISOString(),done_by:S.email});
  if(!ok){ btn.disabled=false; return; }
  await syncOrders(S.visitById.get(v.id)||v,entries);
  let msg = res==="order" ? "حُفظت. مبروك على الطلبية!" : "حُفظت النتيجة";
  if(nd && $("#rs-auto").checked && nd!==v.date && !visitFor(v.customerId,nd)){
    const nid=await createVisit(v.customerId,nd,{purpose:"followup",from_visit:v.id});
    if(nid) msg+=" وأُضيفت المتابعة لخطة "+dShort(nd);
  }
  toast(msg); closeSheet();
}

/* orders: one row per person who ordered in a visit; margin is stored apart and only the manager can read it */
async function syncOrders(v, entries){
  const existing=S.orders.filter(o=>o.visitId===v.id), keep=new Set();
  for(const e of entries){
    const c=S.customers.get(e.cid), ex=existing.find(o=>o.customerId===e.cid);
    const row={order_no:e.orderNo||null,value:e.value>0?e.value:null,date:v.date};
    let r;
    if(ex){ keep.add(ex.id); r=await guard(sb.from("orders").update(row).eq("id",ex.id).select().single()); }
    else r=await guard(sb.from("orders").insert(Object.assign({id:uuid(),visit_id:v.id,customer_id:e.cid,facility_id:c?c.facilityId:null,status:"confirmed",source:"manual",created_by:S.email},row)).select().single());
    if(r){ putOrder(r); if(e.margin!=null&&S.isOwner) await saveMargin(r.id,e.margin); }
  }
  for(const ex of existing) if(!keep.has(ex.id)&&ex.source==="manual"){ const d=await guard(sb.from("orders").delete().eq("id",ex.id)); if(d) dropOrder(ex.id); }
  refresh();
}
async function saveMargin(oid,pct){
  const r=await guard(sb.from("order_costs").upsert({order_id:oid,margin_pct:pct}).select().single());
  if(!r) return;
  S.costs.set(oid,Number(r.margin_pct));
  const o=S.orders.find(x=>x.id===oid), c=o&&S.customers.get(o.customerId); if(!c||!c.facilityId) return;
  const k=facKey(c), t90=addDays(todayStr(),-90);
  let sv=0,sm=0,n=0,sp=0;
  for(const x of S.orders){ const cc=S.customers.get(x.customerId); if(!cc||facKey(cc)!==k||x.date<=t90||!S.costs.has(x.id)) continue; const m=S.costs.get(x.id); n++; sp+=m; if(x.value>0){ sv+=x.value; sm+=x.value*m; } }
  if(!n) return;
  const f=await guard(sb.from("facilities").update({margin_score:clamp((sv>0?sm/sv:sp/n)/S.cfg.marginGood*100)}).eq("id",c.facilityId).select().single());
  if(f) putFac(f);
}

    h+='<h2 class="sec">أرقام جوال مكررة <small>'+dups.length+'</small></h2>'+(dups.length?dups.map(a=>'<div class="issue"><div>'+esc(normPhone(a[0].phone))+'<small>'+esc(a.map(cname).join("، "))+'</small></div><button class="btn sm" data-act="cust" data-id="'+esc(a[0].id)+'">فتح</button></div>').join(""):'<div class="v-sub">لا توجد أرقام مكررة.</div>');
    h+='<h2 class="sec">منشآت بنفس الاسم <small>'+sim.length+'</small></h2>'+(sim.length?sim.map(a=>'<div class="issue"><div>'+esc(a[0].name)+'<small>'+a.length+' سجلات لنفس المنشأة</small></div>'+(S.isOwner?'<button class="btn sm primary" data-act="merge-fac" data-ids="'+esc(a.map(x=>x.id).join("|"))+'">ادمجها</button>':'')+'</div>').join(""):'<div class="v-sub">لا توجد منشآت مكررة.</div>');

    onUpdate(){ const b=$("#sh-body"); if(b) b.innerHTML=draw(); } });
