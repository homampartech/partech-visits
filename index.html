async function mergeFacilities(ids){
  const keep=ids[0], rest=ids.slice(1);
  for(const x of rest){
    const cs=await guard(sb.from("customers").update({facility_id:keep}).eq("facility_id",x).select()); if(!cs) return;
    cs.forEach(putCust);
    const os=await guard(sb.from("orders").update({facility_id:keep}).eq("facility_id",x).select()); if(os&&os.forEach) os.forEach(putOrder);
    const d=await guard(sb.from("facilities").delete().eq("id",x)); if(d) S.facilities.delete(x);
  }
  toast("تم دمج المنشآت"); refresh();
}

/* ---------- QUOTES: price requests per day and how many close ---------- */
function qDate(q){ return q.closedAt?ymd(new Date(q.closedAt)):""; }
function quoteStats(day){
  const q=S.quotes, ws=weekStart(day), we=addDays(ws,6), mk=monthKey(day), won=x=>x.status==="won";
  return {
    day:{n:q.filter(x=>x.date===day).length, w:q.filter(x=>won(x)&&qDate(x)===day).length},
    week:{n:q.filter(x=>x.date>=ws&&x.date<=we).length, w:q.filter(x=>won(x)&&qDate(x)>=ws&&qDate(x)<=we).length},
    month:{n:q.filter(x=>monthKey(x.date)===mk).length, w:q.filter(x=>won(x)&&qDate(x)&&monthKey(qDate(x))===mk).length}
  };
}
function quotesHTML(day){
  const st=quoteStats(day).day, cfg=S.cfg, open=S.quotes.filter(x=>x.status==="open").sort((a,b)=>a.date<b.date?-1:1);
  let h='<section class="card"><h3>طلبات التسعير <small>الهدف '+cfg.dailyQuotes+' يومياً وإغلاق '+cfg.dailyWins+'</small></h3>'
   +kpi("طلبات التسعير",st.n,cfg.dailyQuotes)+kpi("إغلاقات ناجحة",st.w,cfg.dailyWins);
  if(open.length) h+='<h2 class="sec">بانتظار الإغلاق <small>'+open.length+'</small></h2><div class="list">'+open.slice(0,8).map(q=>{
    const c=S.customers.get(q.customerId), age=diff(q.date,todayStr());
    return '<div class="ord" style="flex-wrap:wrap"><span style="flex:1 1 100%"><b>'+esc(c?cname(c):"—")+'</b> · '+esc(shorten(q.item,40))+(q.value>0?' · '+q.value.toLocaleString("en-US")+' ر.س':'')+' <span class="'+(age>=2?"due":"")+'">'+esc(age<=0?"اليوم":"منذ "+plural(age,P_DAY))+'</span></span>'
     +'<button class="btn sm primary" data-act="quote-win" data-id="'+esc(q.id)+'">أُغلقت ✓</button><button class="btn sm" data-act="quote-lose" data-id="'+esc(q.id)+'">لم تُغلق</button></div>';
  }).join("")+'</div>';
  return h+'<button class="btn primary" data-act="new-quote">'+ICON.plus.replace("<svg",'<svg width="18" height="18"')+'طلب تسعير جديد</button></section>';
}

/* ---------- ACHIEVEMENTS: daily, weekly and monthly targets on closed quotes ---------- */
function achievements(day){
  const cfg=S.cfg, st=quoteStats(day), mk=monthKey(day), per=new Map();
  S.quotes.forEach(q=>{ if(q.status==="won"&&q.closedAt){ const d=qDate(q); per.set(d,(per.get(d)||0)+1); } });
  let daysHit=0; per.forEach((n,d)=>{ if(monthKey(d)===mk&&n>=cfg.dailyWins) daysHit++; });
  let streak=0, first=true;
  for(let d=day,i=0;i<120;d=addDays(d,-1),i++){ if(dow(d)===5) continue; if((per.get(d)||0)>=cfg.dailyWins) streak++; else if(first&&d===day) { first=false; continue; } else break; first=false; }
  const weekT=cfg.dailyWins*6, monthT=cfg.dailyWins*cfg.workDaysMonth;
  const dayHit=st.day.w>=cfg.dailyWins, weekHit=st.week.w>=weekT, monthHit=st.month.w>=monthT;
  const credit=monthHit?"الهدف الشهري":weekHit?"الهدف الأسبوعي":dayHit?"الهدف اليومي":"";
  return {st,daysHit,streak,weekT,monthT,dayHit,weekHit,monthHit,credit};
}
function achLine(day){
  const a=achievements(day), cfg=S.cfg;
  return '<div class="achline"><span class="chip '+(a.dayHit?"order":"muted")+'">اليوم '+a.st.day.w+'/'+cfg.dailyWins+(a.dayHit?' ✓':'')+'</span>'
   +'<span class="chip '+(a.weekHit?"order":"muted")+'">الأسبوع '+a.st.week.w+'/'+a.weekT+(a.weekHit?' ✓':'')+'</span>'
   +'<span class="chip '+(a.monthHit?"order":"muted")+'">الشهر '+a.st.month.w+'/'+a.monthT+(a.monthHit?' ✓':'')+'</span></div>';
}
function achCard(day){
  const a=achievements(day), cfg=S.cfg;
  return '<section class="card"><h3>إنجازاتك <small>الإغلاقات الناجحة</small></h3>'
   +kpi("اليوم",a.st.day.w,cfg.dailyWins)+kpi("هذا الأسبوع",a.st.week.w,a.weekT)+kpi("هذا الشهر",a.st.month.w,a.monthT)
   +'<div class="tiles"><div class="tile"><b>'+a.daysHit+'</b><span>أيام حققت فيها الهدف اليومي هذا الشهر</span></div><div class="tile"><b>'+a.streak+'</b><span>أيام عمل متتالية حققت فيها الهدف</span></div></div>'
   +'<div class="credit '+(a.credit?"on":"")+'">'+(a.credit?'يُحتسب لك الآن: <b>'+a.credit+'</b>. الأعلى الذي تحققه هو ما يُحتسب لك.':'حقق '+cfg.dailyWins+' إغلاقات اليوم ليُحتسب لك الهدف اليومي. الأعلى الذي تحققه (يومي ثم أسبوعي ثم شهري) هو ما يُحتسب لك.')+'</div></section>';
}
function ring(val,target,color,label){
  const r=34, c=2*Math.PI*r, p=Math.min(1,target?val/target:0);
  return '<div class="ringbox"><svg viewBox="0 0 84 84" class="ring" aria-hidden="true"><circle cx="42" cy="42" r="34" class="rg-bg"/><circle cx="42" cy="42" r="34" class="rg-fg" style="stroke:'+color+';stroke-dasharray:'+(c*p).toFixed(1)+' '+c.toFixed(1)+'"/></svg>'
   +'<span class="rg-n num">'+val+'</span><span class="rg-l">'+label+'</span><span class="rg-t">من '+target+'</span></div>';
}

function addrName(c){
  let p=String(c&&c.person||"").trim().replace(/\s+/g," ");
  if(!p||p==="—") return "أخي الكريم";
  if(/^(أبو|ابو)\s/.test(p)) return p.replace(/^ابو/,"أبو");
  if(/^م\.?\s/.test(p)) return "المهندس "+p.replace(/^م\.?\s/,"").split(" ")[0];
  if(/^د\.?\s/.test(p)) return "الدكتور "+p.replace(/^د\.?\s/,"").split(" ")[0];
  return "أستاذ "+p.split(" ")[0];
}
function hash(s){ let h=0; for(let i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))>>>0; return h; }
function waText(c,kind,item,seed){
  const k=WA[kind]||WA.hello, i=(hash(c.id+todayStr()+kind)+(seed||0))%k.t.length;
  return k.t[i].replace("{n}",addrName(c)).replace("{s}",(S.me&&S.me.name)||"مندوب المبيعات").replace("{item}",item||"");
}
function lastMsg(cid){ return S.messages.filter(m=>m.customerId===cid).map(m=>m.date).sort().pop()||null; }
/* when is a message better than a visit? Tier A and cooling B accounts always get the visit. */
function waSituation(c){
  const day=todayStr(); if(dow(day)===5||!phoneOk(normPhone(c.phone))) return null;
  const lm=lastMsg(c.id); if(lm&&diff(lm,day)<7) return null;
  const fm=fmOf(c), d=S.der.get(c.id)||{}, stg=stageOf(c.id);
  const oq=S.quotes.filter(q=>q.customerId===c.id&&q.status==="open"&&diff(q.date,day)>=1).sort((a,b)=>a.date<b.date?-1:1)[0];
  if(oq) return {kind:"quote",item:oq.item,u:90};
  if(d.lastOrder){ const n=diff(d.lastOrder,day); if(n>=1&&n<=2) return {kind:"delivered",u:80}; }
  if(fm&&(fm.tier==="A"||(fm.tier==="B"&&fm.fading))) return null;
  if(stg==="current"&&fm&&fm.gap&&fm.dso!=null){
    if(fm.dso>=fm.gap*0.85&&fm.dso<=fm.gap*1.6) return {kind:"reorder",u:70};
    if(fm.dso>fm.gap*1.6&&fm.tier==="C") return {kind:"cold",u:40};
  }
  const lv=S.lastVisit.get(c.id);
  if(stg.startsWith("new")&&lv){ const n=diff(lv,day); if(n>=3&&n<=10) return {kind:"newbie",u:60}; }
  if(stg==="lapsed"&&(!lv||diff(lv,day)>=21)) return {kind:"cold",u:40};
  return null;
}
function waSuggestions(day,max){
  const best=new Map();
  for(const c of S.customers.values()){ const s=waSituation(c); if(!s) continue; const k=facKey(c), o=best.get(k); if(!o||s.u>o.s.u) best.set(k,{c,s}); }
  return [...best.values()].sort((a,b)=>b.s.u-a.s.u).slice(0,max||4);
}
function waHTML(day){
  if(day!==todayStr()||dow(day)===5) return "";
  const items=waSuggestions(day,4); if(!items.length) return "";
  return '<section class="card"><h3>رسائل واتساب مقترحة <small>بنقرة واحدة</small></h3><div class="prio">'
   +items.map(x=>'<div class="pi wa"><div class="pm"><b>'+esc(cname(x.c))+' '+tierChip(x.c)+'</b><span class="pw">'+esc(WA[x.s.kind].label)+'</span></div><button class="btn sm primary" data-act="wa" data-id="'+esc(x.c.id)+'" data-kind="'+x.s.kind+'">رسالة</button></div>').join("")
   +'</div></section>';
}

      go.addEventListener("click",()=>{

  if(a==="carry-drop"){ b.disabled=true; const ids=carryItems(S.day).map(x=>x.carryVisit.id); const up=await guard(sb.from("visits").update({state:"missed"}).in("id",ids).select(),"تم تجاهلها وسُجّلت كزيارات لم تتم"); if(up&&up.forEach){ up.forEach(putVisit); refresh(); } return; }
  if(a==="toggle-imp"){ const c=S.customers.get(id); if(!c) return; const r=await guard(sb.from("customers").update({important:!c.important}).eq("id",id).select().single(),c.important?"أُلغي التمييز":"مُيّز كعميل مهم"); if(r){ putCust(r); refresh(); openCustomer(id); } return; }
  if(a==="guide") return openGuide(id);
  if(a==="wa") return openWa(id,b.dataset.kind||null);
  if(a==="new-quote") return openQuote(id||null);
  if(a==="quote-win") return openQuoteClose(id,true);
  if(a==="quote-lose") return openQuoteClose(id,false);
  if(a==="prio-add"){ b.disabled=true; await createVisit(id,S.day); return; }
  if(a==="open-quality") return openQuality();
  if(a==="edit-order") return openOrder(id);
  if(a==="add-order") return openOrder(null,{cid:id});
  if(a==="margins") return openMargins();
  if(a==="add-person") return openCustomerForm(null,{facilityId:b.dataset.fid||null});
  if(a==="edit-fac") return openFacility(b.dataset.fid);
  if(a==="merge-fac"){ b.disabled=true; await mergeFacilities(b.dataset.ids.split("|")); return; }
  if(a==="settings") return openSettings();
  if(a==="filter"){ S.filter=b.dataset.f; return updateCustomers(); }
  if(a==="copy"){ const t=b.dataset.text; try{ await navigator.clipboard.writeText(t); toast("نُسخ الرقم "+t); }catch(err){ toast("الرقم: "+t); } }
});

/* keep "today" correct if the app stays open past midnight */
let lastToday=todayStr();
setInterval(()=>{ const t=todayStr(); if(t!==lastToday){ if(S.day===lastToday) S.day=t; lastToday=t; refresh(); } },60000);

if("serviceWorker" in navigator) window.addEventListener("load",()=>{ navigator.serviceWorker.register("sw.js").catch(()=>{}); });
boot();
})();
</script>
